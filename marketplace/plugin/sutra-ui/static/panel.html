        // server returns domains2 as a {ref: domain} dict; client code calls
        // array methods (.filter) on it, so normalize to an array here, once.
        S.simCache[key] = { domains2: Object.values(sim.domains2), findings: sim.findings,
                             maxDepth: sim.max_depth, notChecked: sim.not_checked,
                             pending: false, error: null };
        S.simPending.delete(key);
        render();
      })
      .catch(err => {
        S.simPending.delete(key);
        if (gen !== S.simGen) return;
        /* CACHE the failure. Dropping the in-flight guard and caching nothing
           meant the very next render() re-issued the same doomed POST — an
           unbounded retry storm — behind a Health screen showing "Nothing
           flagged" in green, an all-clear the server never sent. */
        S.simCache[key] = { domains2: DOMAINS.slice(), findings: [], maxDepth: 0,
                             notChecked: null, pending: false,
                             /* the raw reason; every consumer already frames it
                                with its own "Validation could not run." heading */
                             error: err.message || "the simulate request failed" };
        console.error("simulate() failed:", err);
        render();
      });
  }
  return emptySim();
}

/* ring codes for a MOVE/* ring codes for a MOVE — reads the in-memory domains array only. That is the
   per-hover budget, and why ORG-001/002/004/009 are not ring codes. */
function blockCodesForMove(src, t){
  const c = [];
  if (t.ref===src.ref || isDescendant(t.ref, src.ref))
    c.push({code:"ORG-006", subject:t.name+" is inside "+src.name});
  if (st(t) !== "active") c.push({code:"ORG-016", subject:t.name+" is "+st(t)});
  if (t.tenant_id !== src.tenant_id) c.push({code:"ORG-017", subject:t.tenant_id+" ≠ "+src.tenant_id});
  const norm = s => s.trim().toLowerCase().replace(/\s+/g," ");
  if (DOMAINS.some(d=>d.ref!==src.ref && d.parent_ref===t.ref && st(d)!=="retired" && norm(d.name)===norm(src.name)))
    c.push({code:"ORG-018", subject:'a live sibling is already named "'+src.name+'"'});
  return c;
}

/* codes that cannot be evaluated — never 0, never passed, never a green tick */
const NOT_CHECKED = [
  ["ORG-005","authority.ceilings has no writer (0 occurrences). Ph4."],
  ["ORG-011","no applied plan exists; revert has no target. Apply is CLI-only (§5.1)."],
  ["ORG-012","origin='unrouted' has no writer (0 occurrences). Floor-held shown separately — a different signal."],
  ["ORG-013","filesystem marker, not observable from a browser. Markers >24h downgrade to warn."],
  ["ORG-014","Workflow.domain_ref unpopulated. Ph4."],
  ["ORG-019","last_routed_ms has no writer (0 occurrences). Freshness derived at render instead."]
];

/* ══════════════════════ classify — the entry point's engine ══════════════════════
   Real POST /api/classify against the actual engine (org_api.py: gather_evidence + classify()
   [NEVER resolve()] + a pick_charter walk + exactly one write_placement() call). No client-side
   scoring reimplementation — the confidence numbers here ARE the real engine's numbers. */
async function runTurn(text, ts){
  const stamp = ts || Date.now();
  let r;
  try {
    const res = await apiPost("/api/classify?" + tenantQ(), { text });
    if (!res.domain_ref) {
      // mode "none": classify() found no candidate at all; nothing was written.
      r = { mode: res.mode || "none", domain: null, confidence: res.confidence || 0,
            matched: [], blocked: res.blocked, text, ts_ms: stamp };
    } else {
      const domain = byRef(res.domain_ref) || { ref: res.domain_ref, name: res.domain_name };
      r = { mode: res.mode, domain, confidence: res.confidence,
            matched: res.matched_terms || [], charter: res.charter, text, ts_ms: stamp };
      if (res.placement) {
        // mode is derived read-side by /api/org/placements too; match that here so a
        // freshly-classified row renders identically to one fetched from the list endpoint.
        const p = { ...res.placement, mode: res.mode === "floor" ? "floor" : "match" };
        PLACEMENTS.unshift(p);
        r.placement = p;
        /* the registry just changed: ORG-004/ORG-009/ORG-020 all read
           placements, and the cache is keyed on ops+base, neither of which
           moved. Without this, findings are frozen at their pre-turn values
           for the rest of the session. */
        invalidateSim();
      }
      if (res.blocked) r.blocked = res.blocked;  // e.g. no charter reachable — still shows the route
    }
  } catch (e) {
    r = { mode: "none", domain: null, confidence: 0, matched: [],
          blocked: "request failed — " + e.message, text, ts_ms: stamp };
  }
  return r;
}
let SID = 0;
/* Start a session, or append a turn to an existing one. Appending is what makes the routing
   path visible: turn 2 can resolve somewhere turn 1 did not. */
async function runTask(text, sessionId){
  const r = await runTurn(text);
  let s = sessionId && S.sessions.find(x=>x.id===sessionId);
  if (!s){
    s = { id:"s-"+(++SID), title:text.length>46?text.slice(0,46)+"…":text,
          created_ms: r.ts_ms, turns:[], local:true, loadState:"live" };
    S.sessions.unshift(s);
    if (!S.openPanes.includes(s.id)) S.openPanes.push(s.id);
    if (S.openPanes.length>2) S.openPanes = S.openPanes.slice(-2);
  }
  s.turns.push(r);
  s.updated_ms = r.ts_ms;
  return { session:s, result:r };
}
/* ══════════════════════ sessions — the REAL ones ══════════════════════
   seedSessions() used to live here. It grouped PLACEMENT rows by the first path
   segment of work_ref and presented each group as a session titled
   "Scratchpad — 3 turns", stamped seeded:true. No such session ever existed:
   the titles were manufactured from file paths and the "turns" were placement
   records replayed as if they were a conversation. It is deleted, not repaired.

   The real source already existed and is what runs now:
     GET /api/sessions          -> session_reader.list_sessions(), which reads
                                   ~/.claude/projects/<encoded-cwd>/<id>.jsonl
     GET /api/sessions/{id}     -> the parsed transcript for one of them

   The list endpoint returns {id, title, project, cwd, branch, mtime, size}. It
   deliberately does NOT return a turn count — it reads only the head of each
   file. So the rail shows the fields that exist and says "transcript unread"
   for the one that does not, rather than printing a number nobody counted. The
   count appears once the pane is opened and the transcript is actually read. */
function adoptRealSessions(rows){
  /* Sessions started IN the panel are held in memory only (they are live
     websocket threads, not files yet), so a refresh of the list must not drop
     them. Everything else is replaced wholesale by what is on disk. */
  const local = S.sessions.filter(s => s.local);
  const real = (rows || []).map(r => ({
    id: r.id,
    title: r.title || "(no prompt)",
    real: true, local: false,
    project: r.project || "", cwd: r.cwd || "", branch: r.branch || "",
    /* mtime is seconds since epoch; the rail's date buckets are in ms. This is
       the file's last write — genuinely "updated", not a fabricated "created". */
    created_ms: (r.mtime || 0) * 1000, updated_ms: (r.mtime || 0) * 1000,
    size: r.size || 0,
    turns: [], loadState: "unread", loadError: null,
    /* the jsonl filename IS the Claude session id, so continuing this session
       from the composer resumes the real thread rather than starting a cold one */
    claude_session: r.id
  }));
  S.sessions = local.concat(real)
    .sort((a,b)=>(b.updated_ms||b.created_ms)-(a.updated_ms||a.created_ms));
}

/* Fold a transcript's message list into the panel's turn shape.
   A turn is one user prompt plus everything the assistant said before the next
   prompt. These turns carry NO domain/charter/confidence, because none was ever
   computed for them: they ran in the terminal, before and outside this panel.
   Leaving those fields null is the point — the pane renders "not routed through
   the panel" rather than inventing a placement to fill the slot. */
function transcriptTurns(messages){
  const out = [];
  (messages || []).forEach(m => {
    const ts = m.ts ? Date.parse(m.ts) : 0;
    if (m.role === "user"){
      out.push({ text: m.text || "", ts_ms: ts || 0, transcript: true,
                 domain: null, mode: "transcript", confidence: 0, matched: [],
                 response: "", tools: [] });
      return;
    }
    let cur = out[out.length - 1];
    if (!cur){
      /* an assistant block before any recorded prompt — say so, do not invent
         a prompt for it */
      cur = { text: "", orphan: true, ts_ms: ts || 0, transcript: true,
              domain: null, mode: "transcript", confidence: 0, matched: [],
              response: "", tools: [] };
      out.push(cur);
    }
    if (m.text) cur.response = cur.response ? (cur.response + "\n\n" + m.text) : m.text;
    if (m.tools && m.tools.length) cur.tools = (cur.tools || []).concat(m.tools);
    if (!cur.ts_ms) cur.ts_ms = ts || 0;
  });
  return out;
}

/* Read one transcript, once, on demand. Opening a pane is the trigger; the list
   endpoint never reads message bodies. Every terminal state is explicit so the
   pane can say which one it is in — "empty" and "error" are different facts and
   neither is "0 turns". */
function ensureTranscript(s){
  if (!s || !s.real || s.loadState !== "unread") return;
  s.loadState = "loading";
  apiGet("/api/sessions/" + encodeURIComponent(s.id))
    .then(d => {
      s.turns = transcriptTurns(d && d.messages);
      s.cwd = (d && d.cwd) || s.cwd;
      s.branch = (d && d.branch) || s.branch;
      s.loadState = s.turns.length ? "ok" : "empty";
      render();
    })
    .catch(e => { s.loadState = "error"; s.loadError = e.message; render(); });
}

/* ══════════════════════ the execution channel — where the studio stops being a viewer ══════
   Until now a turn was classified, a placement was written, the charter was shown — and then
   nothing ran. This is the missing half: one WebSocket to /ws/chat per STUDIO SESSION, opened
   lazily on the first send and reused, so the server's `--resume` threads every turn of that
   session into one Claude conversation.

   The sockets live in a module-level Map, deliberately NOT on S: S is JSON-serialized into the
   draft (saveDraft), and a WebSocket is neither serializable nor meaningful to persist. The
   Claude session id IS stored on the session object (a plain string) so reopening a closed pane
   can resume the same thread. */
const CLAUDE_SOCKETS = new Map();

/* Re-rendering on every token would rebuild the whole pane tree per character and fight the
   focus/caret restoration in render() — the composer would thrash while the operator types.
   Tokens accumulate on the turn; the DOM catches up ~10x/sec. */
let _renderTimer = null;
function scheduleRender(){
  if (_renderTimer) return;
  _renderTimer = setTimeout(()=>{ _renderTimer = null; render(); }, 100);
}

/* ── grounding injection ──
   THIS is the point of Sutra. What reaches Claude is never the raw utterance: it is the
   utterance under the placement the engine just resolved, mirroring what
   marketplace/plugin/hooks/placement-resolve.sh injects per turn in the real product. A weak
   route (mode "floor") says so, and an unresolved route says THAT, rather than quietly sending
   a bare prompt and letting the UI imply a grounding that never happened. */
function groundingPrefix(t){
  const L = [];
  const conf = (t && typeof t.confidence === "number") ? t.confidence.toFixed(2) : "0.00";
  if (t && t.domain){
    const ct = t.charter && t.charter.title ? t.charter.title : "";
    L.push('PLACEMENT: ' + dPath(t.domain.ref) + ' ' + (t.domain.name || "") +
           (ct ? ' | "' + ct + '"' : ' | (no charter reachable from this department)'));
    if (t.charter && t.charter.purpose) L.push('CHARTER PURPOSE: ' + t.charter.purpose);
    L.push('(confidence ' + conf + ', mode ' + (t.mode === "floor" ? "floor" : "match") + ')');
    if (t.mode === "floor")
      L.push('Held at ancestor -- no department claims this. The routing is weak, not ' +
             'authoritative: treat the placement as provisional and say so if this work ' +
             'plainly belongs somewhere else.');
    if (t.blocked) L.push('Routing note: ' + t.blocked);
  } else {
    L.push('PLACEMENT: unresolved -- no department could be resolved for this turn.');
    L.push('(confidence ' + conf + ', mode ' + ((t && t.mode) || "none") + ')');
    if (t && t.blocked) L.push('Reason: ' + t.blocked);
    L.push('Do not invent an address. Proceed, and name the gap if it matters.');
  }
  return L.join("\n") + "\n\n";
}

function claudeWsUrl(){
  return (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/chat";
}
/* Every turn this channel still owes a reply gets the REAL reason it will not arrive.
   Silence and a spinner that never stops are the failure modes this replaces. */
function failChannel(ch, detail){
  const hit = ch.pending.splice(0);
  if (ch.turn) hit.push(ch.turn);
  ch.turn = null;
  hit.forEach(t=>{ t.streaming = false; if (!t.error) t.error = ch.lastError || detail; });
  if (hit.length) scheduleRender();
}
function claudeChannel(s){
  let ch = CLAUDE_SOCKETS.get(s.id);
  if (ch && (ch.ws.readyState === WebSocket.CONNECTING || ch.ws.readyState === WebSocket.OPEN))
    return ch;
  const ws = new WebSocket(claudeWsUrl());
  ch = { ws:ws, sid:s.id, open:false, queue:[], pending:[], turn:null, last:null, lastError:null };
  CLAUDE_SOCKETS.set(s.id, ch);
  ws.onopen = ()=>{ ch.open = true; ch.queue.splice(0).forEach(m=>ws.send(m)); };
  ws.onmessage = ev=>{
    let f; try { f = JSON.parse(ev.data); } catch (e) { return; }
    if (f.type === "start"){
      /* the server emits exactly one "start" per message, in order — that is the
         demarcation that binds the next token stream to the right queued turn */
      ch.turn = ch.pending.shift() || ch.turn;
      if (ch.turn){ ch.turn.streaming = true; ch.last = ch.turn; }
    } else if (f.type === "provider"){
      /* the server states, per connect, which binary it resolved and which
         permission mode it will run under -- including whether that mode
         writes files without asking. Dropping this frame meant the pane could
         not say what it was actually about to do. */
      s.channel = f;
    } else if (f.type === "session"){
      s.claude_session = f.id;
      if (ch.turn) ch.turn.claude_session = f.id;
    } else if (f.type === "token"){
      if (ch.turn) ch.turn.response = (ch.turn.response || "") + f.text;
    } else if (f.type === "thinking"){
      /* Presence only -- the server does not forward the thinking text, so the UI
         says "thinking" and nothing more. */
      if (ch.turn) ch.turn.thinking = true;
    } else if (f.type === "tool"){
      if (ch.turn){
        /* Two parallel stores ON PURPOSE.
           `tools`    -- flat names, the shape the TRANSCRIPT reader produces and a
                         test pins. Left exactly as it was.
           `toolRuns` -- live lifecycle keyed by the server's tool_use id, which is
                         the only thing that can correlate a start with its end.
           Merging them would either break transcript rendering or invent a
           completion state for replayed turns that was never recorded. */
        const runs = (ch.turn.toolRuns = ch.turn.toolRuns || []);
        if (f.phase === "end"){
          /* Match by id. A result whose start was never seen is NOT invented as a
             finished tool -- it is dropped, because a row with no name is noise. */
          const r = f.id && runs.find(x=>x.id === f.id);
          if (r){ r.running = false; r.ok = f.ok !== false; r.endedAt = Date.now(); }
        } else {
          runs.push({ id:f.id, name:f.name || "tool", summary:f.summary || "",
                      caller:f.caller || null, running:true, ok:null,
                      startedAt: Date.now() });
          ch.turn.thinking = false;      /* a tool call ends the thinking phase */
          (ch.turn.tools = ch.turn.tools || []).push(f.name || "tool");
        }
      }
    } else if (f.type === "done"){
      if (ch.turn){
        ch.turn.streaming = false;
        ch.turn.thinking = false;
        /* Server-measured, not client-timed: the wall clock here would include
           queueing and render latency that the operator did not pay for. */
        if (typeof f.duration_ms === "number") ch.turn.duration_ms = f.duration_ms;
        if (typeof f.cost_usd === "number") ch.turn.cost_usd = f.cost_usd;
        if (typeof f.num_turns === "number") ch.turn.num_turns = f.num_turns;
        /* A tool still marked running when the turn ends never reported a result.
           Mark it UNKNOWN rather than silently completing it. */
        (ch.turn.toolRuns || []).forEach(r=>{ if (r.running){ r.running = false; r.ok = null; } });
      }
      ch.turn = null;
    } else if (f.type === "error"){
      ch.lastError = f.detail || "claude failed with no detail";
      /* the stored thread id was rejected -- forget it, or every following message
         re-sends the same dead id and the channel fails identically forever */
      if (f.resume_reset) s.claude_session = null;
      const t = ch.turn || ch.last;
      if (t){
        t.streaming = false; t.thinking = false; t.error = ch.lastError;
        /* Same rule as `done`: a tool that never reported is UNKNOWN, not failed.
           Marking it failed would attribute the turn's error to a specific tool
           that may well have succeeded before the failure happened elsewhere. */
        (t.toolRuns || []).forEach(r=>{ if (r.running){ r.running = false; r.ok = null; } });
        ch.turn = null;
      }
      else failChannel(ch, ch.lastError);   /* refused before any turn started */
    }
    scheduleRender();
  };
  ws.onclose = ev=>{
    if (CLAUDE_SOCKETS.get(s.id) === ch) CLAUDE_SOCKETS.delete(s.id);
    failChannel(ch, "the Claude channel closed before the reply finished" +
      (ev && ev.code ? " (code " + ev.code + ")" : "") + " — is the server still running?");
  };
  return ch;
}
/* Closing the pane closes the socket — the pane IS the session's lifetime here. */
function closeClaudeChannel(sid){
  const ch = CLAUDE_SOCKETS.get(sid);
  if (!ch) return;
  CLAUDE_SOCKETS.delete(sid);
  failChannel(ch, "pane closed before the reply finished");
  try { ch.ws.close(); } catch (e) {}
}
/* Run the turn. Fire-and-forget by design: tokens arrive on the socket and land on the
   turn object, which re-renders on the throttle. */
function askClaude(s, turn){
  if (!turn) return;
  turn.response = turn.response || "";
  turn.tools = turn.tools || [];
  turn.error = null;
  turn.streaming = true;
  turn.sent = groundingPrefix(turn) + turn.text;   /* exactly what the model receives */
  let ch;
  try { ch = claudeChannel(s); }
  catch (e){
    turn.streaming = false;
    turn.error = "could not open the Claude channel: " + e.message;
    scheduleRender(); return;
  }
  ch.pending.push(turn);
  const frame = JSON.stringify({ message: turn.sent, resume: s.claude_session || null });
  if (ch.open) ch.ws.send(frame); else ch.queue.push(frame);
  scheduleRender();
}
/* classify -> file the placement -> run Claude under that placement. The classify
   round-trip is awaited (a turn cannot be grounded before it has an address); the
   Claude run is not (it streams into the pane). */
async function submitTurn(text, sessionId){
  const { session, result } = await runTask(text, sessionId);
  render();
  askClaude(session, result);
}

/* ══════════════════════ state ══════════════════════ */
const S = {
  screen:"departments", sel:null, view:"live", showRetired:false, showAcme:false,
  /* first run. `onbDismissed` is per-load only; the persisted acknowledgement
     is settings.onboarded, so "Not now" brings the disclosure back next launch.
     runtimeError/sessionsError hold a subsystem that failed WITHOUT taking the
     boot down with it (see boot()'s allSettled). */
  onbDismissed:false, runtimeError:null, sessionsError:null,
  /* git: loaded lazily when the screen is first opened, so a workdir that is not a
     repository costs nothing until the operator actually asks. gitDiff is null while
     a fetch is in flight, "" when git genuinely returned an empty diff -- the two are
     different answers and the screen renders them differently. */
  git:null, gitError:null, gitFile:null, gitDiff:null, gitDiffTruncated:false,
  /* null = "show the value in force"; a string = the operator is editing it. Kept in S
     because render() rebuilds the pane wholesale and would otherwise drop the keystrokes. */
  workdirDraft:null,
  /* Terminal pane. The iframe is mounted ONCE and then only shown/hidden: re-creating
     it on every render() would kill the PTY and the session inside it on any unrelated
     state change. termCwd records the workdir the PTY was started with, so a later
     workdir change can say plainly that the running terminal is still in the old one
     rather than silently mislabelling it. */
  termOpen:false, termCwd:null, termW:null,
  /* A session is a run of turns. Each turn resolves to exactly ONE department (ADR-028);
     successive turns may land in different ones, which is how a session traces a path
     through the org. Departments do NOT hand work to each other — no such channel exists. */
  sessions:[], openPanes:[], sgroup:"recent", sessTab:{}, collapsed:new Set(),
  /* sid -> the operator has deliberately scrolled AWAY from the newest turn.
     Two weaker designs failed first: a one-shot Set was consumed by an early
     render before the transcript loaded, and a turn-COUNT key skipped re-pinning
     when render() rebuilt #panes with the same turns and reset scrollTop to 0.
     What actually matters is INTENT, so that is what is stored. */
  userScrolled:new Map(),
  draft:{ ops:[], base:{...PLANS[0].base}, rationale:"", plan_origin:"studio-drag", validated_at_ms:null },
  drift:false, sort:{col:"title",dir:1}, cf:{kind:new Set(),status:new Set()}, q:"",
  pmode:"all", selCharter:null, drag:null,
  /* simGen: bumped by invalidateSim() so an in-flight simulate() response from
     before a registry mutation is discarded instead of cached.
     renderDirty: a render() deferred because a drag is in progress (B11). */
  simCache:{}, simPending:new Set(), simGen:0, renderDirty:false, loaded:false,
  /* Knowledge search + the composer's "/" palette. searchHits is null until
     a query runs, so the rail shows no count rather than a misleading 0. */
  sq:"", searchRes:null, searchHits:null, searchBusy:false, palette:null,
  /* Composer text per session. render() rebuilds the pane from a template, so
     text living only in the DOM is lost on ANY re-render that is not focus-
     restored -- which is every re-render triggered by something other than the
     operator typing (opening the palette, a simulate() response, a token frame).
     Keeping it in state makes it survive unconditionally. */
  composerText:{},
  /* tenant: the scope EVERY registry request carries (?tenant=). null means the
     choice has not been made yet and the tenant gate is what renders.
     gate: the chooser is open on purpose (rail footer), even though a tenant
     is already selected. */
  tenant:null, gate:false, tenantsError:null,
  /* Layout the operator adjusted, restored from localStorage on load:
       paneCollapsed[<"browse"|sessionId>] -> true
       folds[<fold key>]                   -> 0 (closed) | 1 (open)
       browseW                             -> px width of the browse pane */
  ui: loadLayout(),
  /* Settings screen: the in-flight/failed state of a POST, so a refused write
     shows the server's reason instead of silently doing nothing. */
  setBusy:null, setError:null, setOk:null
};
/* The real draft lives server-side at DRAFTS_DIR (outside SUTRA_NATIVE_HOME) -- boot()
   fetches it into S.draft on startup. saveDraft() posts the current S.draft back; callers
   already treat it as fire-and-forget (they call render() right after), so this stays async
   without needing every call site to await it. */
/* Writes are CHAINED, never concurrent. The rationale field posted on every
   keystroke with no ordering guarantee, so a slow early request could land
   after a fast later one and the server would keep the older text — the field
   silently reverting a word or two behind what was typed. Structural edits
   (drop/revert/discard/rebase) flush immediately; typing debounces. */
let _draftChain = Promise.resolve();
let _draftTimer = null;
function _postDraft(){
  const body = { ops: S.draft.ops.slice(), rationale: S.draft.rationale, base: S.draft.base };
  _draftChain = _draftChain
    .then(() => apiPost("/api/org/draft", body))
    .catch(err => console.error("saveDraft failed:", err));  /* keep the chain alive */
  return _draftChain;
}
function saveDraft(){
  if (_draftTimer){ clearTimeout(_draftTimer); _draftTimer = null; }
  return _postDraft();
}
function saveDraftSoon(){
  if (_draftTimer) clearTimeout(_draftTimer);
  _draftTimer = setTimeout(()=>{ _draftTimer = null; _postDraft(); }, 300);
}
async function loadDraft(){
  try {
    const d = await apiGet("/api/org/draft");
    if (d && Array.isArray(d.ops)) {
      S.draft = { ops:d.ops, base:d.base||{}, rationale:d.rationale||"",
                  plan_origin:"studio-drag", validated_at_ms:null };
    }
  } catch (e) { console.error("loadDraft failed:", e); }
}

const el = (h)=>{ const t=document.createElement("template"); t.innerHTML=h.trim(); return t.content; };
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

/* ══════════════════════ markdown, rendered safely ══════════════════════
   Transcript text is UNTRUSTED — it is whatever was typed into a session or
   returned by a model. Turning it into HTML is a new injection surface, so the
   ordering here is not stylistic, it is the whole safety argument:

     1. esc() the ENTIRE input first. After this line no '<' survives, so no
        markup in the source can ever become an element.
     2. Only then apply markdown, and only ever by wrapping already-inert text
        in tags THIS function authors.

   Nothing takes a different path to innerHTML. Links are scheme-checked
   against http/https, so `javascript:` and `data:` URLs cannot survive even
   though the surrounding text is inert. Parked spans use \u0000 sentinels,
   which cannot appear in escaped output, so later passes cannot corrupt them. */
const MD_URL_OK = /^https?:\/\//i;

function mdHtml(src){
  let t = esc(src).replace(/\r\n?/g, "\n");
  const slot = [];
  const park = html => "\u0000" + (slot.push(html) - 1) + "\u0000";

  t = t.replace(/```[ \t]*([A-Za-z0-9_+.#-]*)\n([\s\S]*?)```/g,
    (m, lang, code) => park('<pre class="md-pre"><code>' + code.replace(/\n+$/, "") + "</code></pre>"));
  t = t.replace(/`([^`\n]+)`/g, (m, c) => park('<code class="md-code">' + c + "</code>"));
  t = t.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, (m, label, url) =>
    MD_URL_OK.test(url)
      ? park('<a class="md-a" href="' + url + '" target="_blank" rel="noopener noreferrer">' + label + "</a>")
      : m);
  t = t.replace(/(^|[\s(])(https?:\/\/[^\s<>()\[\]]+)/g, (m, pre, url) =>
    pre + park('<a class="md-a" href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + "</a>"));

  const inline = x => x
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/(^|[^_\w])_([^_\n]+)_/g, "$1<em>$2</em>")
    .replace(/~~([^~\n]+)~~/g, "<del>$1</del>");

  const rows = t.split("\n");
  const out = [];
  const isTableSep = l => /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(l) && l.indexOf("-") !== -1 && l.indexOf("|") !== -1;
  const cells = l => l.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(c => inline(c.trim()));
  let i = 0;
  while (i < rows.length){
    const line = rows[i];

    if (!line.trim()){ i++; continue; }
    if (/^\s*(?:---+|\*\*\*+|___+)\s*$/.test(line)){ out.push("<hr class=\"md-hr\">"); i++; continue; }

    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h){ const n = h[1].length; out.push("<h" + n + ' class="md-h">' + inline(h[2].trim()) + "</h" + n + ">"); i++; continue; }

    /* table: a header row followed by a |---|---| separator */
    if (line.indexOf("|") !== -1 && i + 1 < rows.length && isTableSep(rows[i + 1])){
      const head = cells(line);
      i += 2;
      const body = [];
      while (i < rows.length && rows[i].indexOf("|") !== -1 && rows[i].trim()){ body.push(cells(rows[i])); i++; }
      out.push('<div class="md-tw"><table class="md-t"><thead><tr>'
        + head.map(c => "<th>" + c + "</th>").join("")
        + "</tr></thead><tbody>"
        + body.map(r => "<tr>" + r.map(c => "<td>" + c + "</td>").join("") + "</tr>").join("")
        + "</tbody></table></div>");
      continue;
    }

    if (/^\s*&gt;\s?/.test(line)){
      const buf = [];
      while (i < rows.length && /^\s*&gt;\s?/.test(rows[i])){ buf.push(rows[i].replace(/^\s*&gt;\s?/, "")); i++; }
      out.push('<blockquote class="md-q">' + inline(buf.join(" ")) + "</blockquote>");
      continue;
    }

    const ul = /^\s*[-*+]\s+(.*)$/, ol = /^\s*\d+[.)]\s+(.*)$/;
    if (ul.test(line) || ol.test(line)){
      const ordered = ol.test(line);
      const re = ordered ? ol : ul;
      const items = [];
      while (i < rows.length && re.test(rows[i])){ items.push(inline(rows[i].match(re)[1])); i++; }
      const tag = ordered ? "ol" : "ul";
      out.push("<" + tag + ' class="md-l">' + items.map(x => "<li>" + x + "</li>").join("") + "</" + tag + ">");
      continue;
    }

    const para = [];
    while (i < rows.length && rows[i].trim()
           && !/^(#{1,6})\s/.test(rows[i]) && !ul.test(rows[i]) && !ol.test(rows[i])
           && !/^\s*&gt;\s?/.test(rows[i]) && !/^\s*(?:---+|\*\*\*+|___+)\s*$/.test(rows[i])){
      para.push(rows[i]); i++;
    }
    out.push('<p class="md-p">' + inline(para.join("\n")).replace(/\n/g, "<br>") + "</p>");
  }

  return out.join("").replace(/\u0000(\d+)\u0000/g, (m, n) => slot[Number(n)]);
}

const ICON = {

  skills:'<path d="M12 3l7.5 4.3v8.6L12 20.2 4.5 15.9V7.3z"/><path d="M12 12l7.5-4.4M12 12v8.2M12 12L4.5 7.6"/>',
  ten:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M8 5V3M16 5V3"/>',
  gear:'<circle cx="12" cy="12" r="3.1"/><path d="M19.4 13.5a7.9 7.9 0 000-3l2-1.5-2-3.4-2.3 1a7.9 7.9 0 00-2.6-1.5L14 2.5h-4l-.5 2.6a7.9 7.9 0 00-2.6 1.5l-2.3-1-2 3.4 2 1.5a7.9 7.9 0 000 3l-2 1.5 2 3.4 2.3-1a7.9 7.9 0 002.6 1.5l.5 2.6h4l.5-2.6a7.9 7.9 0 002.6-1.5l2.3 1 2-3.4z"/>',
  chevron:'<path d="M6 9l6 6 6-6"/>'
};
function railSpec(){
  const sim = S.loaded ? simulate(S.draft.ops) : null;
  /* "0 open issues" and "we have not been told yet" are different facts, and a
     green-looking 0 for the second is the more expensive lie. Before the
     registry has been read at all (tenant gate), every count is withheld for
     the same reason -- a 0 there would be a claim about a tenant nobody has
     loaded yet. */
  const openIssues = !sim ? undefined
    : sim.pending ? "…" : (sim.error ? "!" : sim.findings.length);
  const c = v => S.loaded ? v : undefined;
  return {
    org:[
      {id:"departments",n:"Departments",i:"dept", c:c(live().filter(d=>inTenant(d,META.tenant_id)).length)},
      {id:"charters",   n:"Charters",   i:"chart",c:c(CHARTERS.length)},
      {id:"placements", n:"Placements", i:"plc",  c:c(PLACEMENTS.length)},
      {id:"knowledge",  n:"Knowledge",  i:"know", c:(S.searchHits==null?undefined:S.searchHits)}
    ],
    change:[
      {id:"reorg",  n:"Reorg plans", i:"reorg", c:PLANS.length},
      {id:"history",n:"History",     i:"hist"},
      /* Git sits in CHANGE because that is what it reports: what changed in the
         working tree. The count is withheld until the screen has been opened --
         a 0 before anything was read would be a claim about a repo nobody looked at. */
      {id:"git",    n:"Git",         i:"git",   c:(S.git ? ((S.git.status||{}).files||[]).length : undefined)},
      {id:"health", n:"Health",      i:"health",c:openIssues, warn:true}
    ],
    runtime:[
      {id:"skills",  n:"Skills",   i:"skills",c:(SKILLS.length||undefined)},
      /* Terminal is a PANE TOGGLE, not a screen -- but it belongs in the rail
         anyway. It shipped as a 19px unlabelled icon in the footer and the first
         operator to use it reported "I don't see terminal": a control nobody can
         find is not a shipped feature. The footer icon stays for muscle memory;
         renderRail routes this id to termToggle() instead of setting S.screen. */
      {id:"terminal",n:"Terminal", i:"term", toggle:true},
      /* Settings is not a count -- it is provider + permission mode + workdir,
         all three of which are single values with a live server behind them. */
      {id:"settings",n:"Settings", i:"gear"}
    ]
  };
}
/* The workspace switcher. Deliberately worded as SCOPE, not isolation:
   placement_engine's own tenant_refs() docstring says "MISROUTING GUARD, not
   isolation ... Do not describe it with the word isolation" -- all tenants
   share one registry directory. Calling this a boundary in the UI would claim
   a guarantee the engine explicitly disclaims. */
function renderTenantMenu(){
  const menu = document.getElementById("tenantMenu");
  if (!menu) return;
  const rows = (TENANTS || []).map(r=>`
    <button type="button" role="menuitem" data-pick-tenant="${esc(r.tenant_id)}"
            ${r.tenant_id===S.tenant?'aria-current="true"':""}>
      <span class="${r.tenant_id===S.tenant?"cur":""}">${esc(r.tenant_id)}</span>
      <span class="tm2">${r.domains} dept · ${r.placements} plc</span>
    </button>`).join("");
  menu.innerHTML = `<div class="th">Workspace</div>${rows ||
      '<div class="note">No workspaces found in the registry.</div>'}
    <div class="note">Switching re-scopes every screen — departments, charters and
      placements are all read at this scope.</div>`;
}

function renderRail(){
  const spec = railSpec();
  const mk = items => items.map(it=>`
    <li><button type="button" data-screen="${it.id}" ${it.disabled?"disabled":""}
        aria-current="${it.toggle ? (it.id==="terminal" && S.termOpen) : S.screen===it.id}"
        ${it.disabled?'title="§8.5.3 — an item appears in the rail only if a file backs it. The FTS5 derived index (§7.3) does not exist yet."':""}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">${ICON[it.i]}</svg>
      ${esc(it.n)}
      ${it.disabled?`<span class="dis">${esc(it.dis)}</span>`
        :(it.c!==undefined?`<span class="ct ${it.warn?"w":""}">${it.c}</span>`:"")}
    </button></li>`).join("");
  navOrg.innerHTML = mk(spec.org);
  navChange.innerHTML = mk(spec.change);
  navRuntime.innerHTML = mk(spec.runtime);

  /* Section collapse. Default is EXPANDED, so a fresh install shows the whole
     rail; only an explicit collapse is persisted. */
  document.querySelectorAll("[data-railsec]").forEach(btn=>{
    const key = btn.dataset.railsec;
    const open = S.ui.railSections[key] !== false;
    btn.setAttribute("aria-expanded", String(open));
    const body = document.getElementById(btn.getAttribute("aria-controls"));
    if (body) body.hidden = !open;
  });

  /* Tab visibility. Home is the default so a fresh install lands on the org
     surface; only an explicit switch is persisted. */
  const tab = (S.ui.railTab === "code") ? "code" : "home";
  document.querySelectorAll("[data-railtab]").forEach(b=>
    b.setAttribute("aria-selected", String(b.dataset.railtab === tab)));
  const home = document.getElementById("tabHome"), code = document.getElementById("tabCode");
  if (home) home.hidden = tab !== "home";
  if (code) code.hidden = tab !== "code";

  renderTenantMenu();

  /* Sessions, two ways.
     RECENT is the familiar shape — date buckets, newest first.
     BY DEPARTMENT is the one only Sutra can offer: every turn already resolved to exactly one
     accountable department, so the session list and the org chart are the same tree. */
  document.querySelectorAll("[data-sgroup]").forEach(b=>
    b.setAttribute("aria-pressed", String(S.sgroup===b.dataset.sgroup)));

  const bucket = ms => {
    const d = Math.floor((NOW - ms)/DAY);
    return d<=0 ? "Today" : d===1 ? "Yesterday" : d<=7 ? "Previous 7 days"
         : d<=30 ? "Previous 30 days" : "Older";
  };
  const deptsOf = s => [...new Set(s.turns.filter(t=>t.domain).map(t=>dPath(t.domain.ref)))];
  /* The list endpoint reads only the head of each .jsonl, so it has no turn
     count to give. Say "transcript unread" until the pane actually reads it --
     printing a 0, or reusing the file size as a turn count, would both be
     numbers nobody counted. `project` and the file size ARE real, so those are
     what the unread row carries. */
  const kb = n => n >= 1048576 ? (Math.round(n/104857.6)/10) + " MB"
               : n >= 1024      ? (Math.round(n/102.4)/10) + " KB"
                                : n + " B";
  const sessMeta = s => {
    if (!s.real) return `<span>${s.turns.length} turn${s.turns.length===1?"":"s"}</span>`;
    if (s.loadState === "ok" || s.loadState === "empty")
      return `<span>${s.turns.length} turn${s.turns.length===1?"":"s"}</span>`;
    if (s.loadState === "loading") return `<span>reading transcript…</span>`;
    if (s.loadState === "error") return `<span style="color:var(--block)">unreadable</span>`;
    return `<span>transcript unread</span><span>${kb(s.size||0)}</span>`;
  };
  /* `project` is the ENCODED directory name (slashes turned into dashes), which
     reads as gibberish in a 200px rail. `cwd` is the same directory unencoded
     and is returned by the same endpoint, so prefer its last segment and fall
     back to the encoded form only when cwd is absent. */
  const projOf = s => {
    const c = (s.cwd || "").replace(/\/+$/, "");
    if (c) return c.slice(c.lastIndexOf("/") + 1);
    return (s.project || "").replace(/^-+|-+$/g, "");
  };

  let html = "";
  if (S.sgroup === "recent"){
    const order = ["Today","Yesterday","Previous 7 days","Previous 30 days","Older"];
    const g = {};
    S.sessions.forEach(s=>{ const k=bucket(s.updated_ms||s.created_ms); (g[k]=g[k]||[]).push(s); });
    html = order.filter(k=>g[k]).map(k=>`
      <div class="rgrp">${k}</div>
      <ul class="rlist">${g[k].map(s=>{
        const ds = deptsOf(s);
        const held = s.turns.some(t=>t.mode==="floor");
        return `<li><button type="button" data-open="${s.id}"
            aria-current="${S.openPanes.includes(s.id)}"
            title="${esc(s.real ? (s.cwd || s.project || "") : "started in this panel")}">
          <span class="t">${esc(s.title)}</span>
          <span class="m">${sessMeta(s)}
            <span>${s.real ? esc(projOf(s)) : (ds.length?esc(ds.join(" → ")):"—")}</span>
            ${held?'<span style="color:var(--warn)">held</span>':""}</span>
        </button></li>`;}).join("")}</ul>`).join("");
    if (!S.sessions.length) html = `<p style="padding:10px 12px;font-size:11px;color:var(--faint)">
      No sessions on disk under <code>~/.claude/projects</code>, and none started here yet.</p>`;
  } else {
    const g = {};
    S.sessions.forEach(s=>s.turns.forEach(t=>{
      if (!t.domain) return; (g[t.domain.ref]=g[t.domain.ref]||[]).push({s,t}); }));
    html = Object.entries(g)
      .sort((a,b)=>dPath(a[0]).localeCompare(dPath(b[0]),undefined,{numeric:true}))
      .map(([ref,items])=>{
        const d = byRef(ref); if(!d) return "";
        const held = items.filter(x=>x.t.mode==="floor").length;
        const uniq = [...new Map(items.map(x=>[x.s.id,x.s])).values()];
        return `<div class="rgrp">${esc(dPath(ref))} ${esc(d.name)}${held?` · ${held} held`:""}</div>
          <ul class="rlist">${uniq.map(s=>`<li><button type="button" data-open="${s.id}"
              aria-current="${S.openPanes.includes(s.id)}">
            <span class="t">${esc(s.title)}</span>
            <span class="m"><span>${items.filter(x=>x.s.id===s.id).length} turn(s) here</span></span>
          </button></li>`).join("")}</ul>`;
      }).join("");
    if (!html) html = `<p style="padding:10px 12px;font-size:11px;color:var(--faint)">
      Nothing filed yet. Transcripts read from <code>~/.claude/projects</code> ran outside
      this panel, so no department was ever resolved for them — they group under Recent only.</p>`;
  }
  document.getElementById("sessions").innerHTML = html;

  /* the tenant is a live selection now, so the chip and the footer switch both
     read it rather than repeating a hardcoded "T-local" */
  const chip = document.getElementById("tenantChip");
  if (chip) chip.textContent = S.tenant || "no tenant";
  const sw = document.getElementById("tenantSwitch");
  if (sw) sw.textContent = (S.tenant || "choose a tenant") + " · switch";
}

/* ══════════════════════ screens ══════════════════════ */
const SCREENS = {};

/* ── collapsible section ──────────────────────────────────────────────────
   Panels inside the browse pane are no longer permanently fixed. Each one is
   a fold whose open/closed state is keyed and persisted, so the operator's
   layout survives a reload. The header ALWAYS carries a summary of what is
   inside (`summary`), because a collapsed section that hides its own count is
   indistinguishable from an empty one. Default is open: nothing disappears
   until the operator says so. */
function foldOpen(key, dflt){
  const v = S.ui.folds[key];
  return v === undefined ? (dflt !== false) : !!v;
}
function fold(key, title, summary, inner, dflt){
  const open = foldOpen(key, dflt);
  return `<section class="fold" data-open="${open?1:0}">
    <button class="fh" type="button" data-fold="${esc(key)}" aria-expanded="${open}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           aria-hidden="true">${ICON.chevron}</svg>
      ${esc(title)}<span class="cv">${summary==null?"":esc(String(summary))}</span>
    </button>
    <div class="fc">${inner}</div>
  </section>`;
}

/* ── S1 Departments ── */
SCREENS.departments = () => {
  const t = META.tenant_id;
  const vis = DOMAINS.filter(d=>(S.showAcme || inTenant(d,t)) && (S.showRetired || isLive(d)));
  const roots = vis.filter(d=>!d.parent_ref || !vis.find(p=>p.ref===d.parent_ref));
  /* Tenant of record leads its own org chart. Both tenants' roots are "D0"
     (D-numbering is per tenant), so a path sort ties and whichever row the
     server happened to yield first won -- which could be T-acme's. The server
     now orders this deliberately; sort defensively here too, because "whose
     org is this" must not depend on a remote sort key. Array#sort is stable,
     so everything else keeps its order. */
  roots.sort((a,b)=>(inTenant(a,t)?0:1)-(inTenant(b,t)?0:1));
  const kids = ref => vis.filter(d=>d.parent_ref===ref)
                         .sort((a,b)=>a.ts_minted_ms-b.ts_minted_ms);
  const draft = S.view==="draft";

  /* turn counts per department, so a node shows how much has actually been filed here */
  const turnsOn = ref => S.sessions.reduce((n,s)=>
    n + s.turns.filter(x=>x.domain && x.domain.ref===ref).length, 0);

  const subtreeN = r => kids(r).reduce((a,c)=>a+1+subtreeN(c.ref),0);
  const card = d => {
    const cs = chartersOf(d.ref).filter(c=>c.status!=="retired");
    const ret = st(d)==="retired";
    const acme = d.tenant_id!==t;
    const n = turnsOn(d.ref);
    /* collapsed subtree count lives on the tile — nothing disappears silently */
    const hidden = (kids(d.ref).length && S.collapsed.has(d.ref)) ? subtreeN(d.ref) : 0;
    return `<button class="ocard ${ret?"retired":""} ${acme?"acme":""}" data-ref="${d.ref}"
        data-kids="${kids(d.ref).length?1:0}"
        ${draft && !ret ? 'draggable="true"' : ''} aria-selected="${S.sel===d.ref}">
      ${n?`<span class="turnbadge">${n}</span>`:""}
      <span class="odp">${esc(dPath(d.ref))}</span>
      <span class="onm">${esc(d.name)}</span>
      <span class="ometa">
        <span>${cs.length?cs.length+" chr":'<span style="color:var(--warn)">no charter</span>'}</span>
        <span>${placementsOf(d.ref).length} plc</span>
        ${ret?'<span style="color:var(--block)">retired</span>':""}
        ${acme?`<span style="color:var(--warn)">${esc(d.tenant_id)}</span>`:""}
        ${hidden?`<span class="below">${hidden} below</span>`:""}
      </span>
    </button>`;
  };
  /* expandable: a node with children carries a +/− control; collapsed subtrees are
     summarised on the control so nothing disappears silently */
  const branch = d => {
    const ks = kids(d.ref);
    const open = ks.length && !S.collapsed.has(d.ref);
    return `<li class="${open?"haskids":""}">
      ${card(d)}
      ${open?`<ul>${ks.map(branch).join("")}</ul>`:""}
    </li>`;
  };

  const sel = S.sel && byRef(S.sel);
  let insp = `<div class="insp"><div class="zero" style="padding:20px 8px">
      <p>Select a department to inspect it.</p></div></div>`;
  if (sel){
    const cs = chartersOf(sel.ref), ps = placementsOf(sel.ref);
    const open = ps.filter(p=>p.phase==="open");
    const oldest = open.length ? Math.min(...open.map(p=>p.ts_ms)) : null;
    const succ = (sel.successor_refs||[]).map(r=>byRef(r)).filter(Boolean);
    insp = `<div class="insp">
      <h4>${esc(sel.name)}</h4>
      <div class="sub">${esc(dPath(sel.ref))} · ${esc(sel.ref)}</div>
      ${sel.description?`<p style="font-size:11.5px">${esc(sel.description)}</p>`:
        `<p style="font-size:11.5px;color:var(--faint)">No description — system-minted nodes carry none.</p>`}
      <div class="kv"><b>Status</b><span>${esc(st(sel))}${sel.retired_at_ms?" · "+fmt(sel.retired_at_ms):""}</span></div>
      <div class="kv"><b>Tenant</b><span>${esc(sel.tenant_id)}</span></div>
      <div class="kv"><b>Charters</b><span>${cs.length||"none"}</span></div>
      <div class="kv"><b>Placements</b><span class="num">${ps.length}</span></div>
      ${succ.length?`<div class="kv"><b>Succeeded by</b><span>${succ.map(s=>esc(s.name)).join(" · ")}</span></div>`:""}
      ${sel.retire_reason_code?`<div class="kv"><b>Reason</b><span>${esc(sel.retire_reason_code)} <span class="pill p-mut">private</span></span></div>`:""}
      <h3 class="sec" style="margin:13px 0 7px">Currently</h3>
      ${open.length? `<p style="font-size:11.5px;margin:0">${open.length} open work unit${open.length>1?"s":""}${oldest?`, oldest opened ${fmt(oldest)}`:""}.</p>`
                   : `<p style="font-size:11.5px;margin:0;color:var(--faint)">Nothing open.</p>`}
      ${cs.length? `<h3 class="sec" style="margin:13px 0 7px">Charters</h3>` +
        cs.map(c=>`<div class="kv"><b>${esc(c.kind)}</b><span>${esc(c.title)}
          ${isSuperseded(c)?'<span class="pill p-mut">superseded</span>':""}</span></div>`).join("")
        : `<h3 class="sec" style="margin:13px 0 7px">Charters</h3>
           <p style="font-size:11.5px;color:var(--warn);margin:0">No charter yet — this department
           can be routed to, but nothing frames what it owns.</p>`}
    </div>`;
  }

  const sim = simulate(S.draft.ops);
  return `
    <div class="facets">
      <span class="fl">View</span>
      <span class="seg">
        <button type="button" data-view="live"  aria-pressed="${!draft}">Live</button>
        <button type="button" data-view="draft" aria-pressed="${draft}">Draft${S.draft.ops.length?` · ${S.draft.ops.length}`:""}</button>
      </span>
${DOMAINS.some(d=>st(d)==="retired")
        ? `<button class="btn" data-toggle="showRetired" aria-pressed="${S.showRetired}">Show retired</button>` : ""}
      ${TENANTS.length > 1
        /* condition on the TENANT LIST, not on the rows already fetched: under
           ?tenant= the fetched rows are all one tenant by construction, so the
           old test could never be true and the scope could never be widened */
        ? `<button class="btn" data-toggle="showAcme" aria-pressed="${S.showAcme}">Show other tenants</button>` : ""}
    </div>
    ${draft?`<div class="note w"><b>Draft — nothing on this canvas touches the registry.</b>
       Drag a department onto another to compose a MOVE. Every other operation is a checklist,
       and there is no Apply button in this tier.</div>`:""}
    <div class="cols">
      <div>
        ${fold("dept.chart", "Org chart",
          `${vis.length} shown · ${S.collapsed.size} subtree${S.collapsed.size===1?"":"s"} collapsed`, `
          <div class="canvas ${draft?"draft":""}">
            <div class="chartwrap">
              <ul class="chart">${roots.map(branch).join("")}</ul>
            </div>
          </div>
          <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
            <button class="btn" data-expall="1">Expand all</button>
            <button class="btn" data-collall="1">Collapse to top level</button>
            <span style="font-size:10.5px;color:var(--faint);align-self:center">
              a badge on a node counts turns filed there</span>
          </div>
          ${draft?`<div class="legend">A ring means <b style="color:var(--block)">blocked</b>.
            The absence of a ring is not a promise — ORG-001/002/004/009 are not evaluated per hover,
            and ORG-005/012/019 cannot be evaluated at all. D-paths are greyed during a drag and
            <b>recomputed at apply</b>. Sibling gaps and whitespace are not drop targets.
            <span id="dragStatus"></span></div>`:""}`)}
        <div class="note"><b>Note.</b> This registry has no
          <code>D0.design</code>, so its published site would render in the generator's
          <code>NEUTRAL</code> fallback — accent <code>#1d4ed8</code>, blue — while this shell is bronze.
          Sutra's own published pages are not Sutra-branded until the tokens are written to D0.</div>
      </div>
      <div>
        ${fold("dept.insp", "Inspector", sel ? dPath(sel.ref) + " " + sel.name : "nothing selected", insp)}
        ${fold("dept.metrics", "Metrics", null, `
          <div class="metrics" style="margin:0">
            <div>live<b>${live().filter(d=>inTenant(d,META.tenant_id)).length}</b></div>
            <div>retired<b>${DOMAINS.filter(d=>!isLive(d)).length}</b></div>
            <div>max depth<b>${simNum(sim, sim.maxDepth)}</b></div>
            <div>findings<b>${simNum(sim, sim.findings.length)}</b></div>
          </div>`)}
      </div>
    </div>`;
};

/* ── S2 Charters ── */
SCREENS.charters = () => {
  const kinds = [...new Set(CHARTERS.map(c=>c.kind))];
  const stats = [...new Set(CHARTERS.map(c=>c.status))];
  let rows = CHARTERS.filter(c=>{
    if (S.cf.kind.size && !S.cf.kind.has(c.kind)) return false;
    if (S.cf.status.size && !S.cf.status.has(c.status)) return false;
    if (S.q && !(c.title+" "+c.purpose).toLowerCase().includes(S.q.toLowerCase())) return false;
    return true;
  });
  const col = S.sort.col, dir = S.sort.dir;
  rows.sort((a,b)=>{
    const v = x => col==="fresh" ? (lastRouted(x.id)||0)
              : col==="owner" ? (byRef(x.domain_ref)?dPath(x.domain_ref):"")
              : String(x[col]||"");
    const A=v(a),B=v(b); return (A>B?1:A<B?-1:0)*dir;
  });
  const sel = S.selCharter && CHARTERS.find(c=>c.id===S.selCharter);
  const fbtn = (g,v)=>`<button class="btn" data-facet="${g}" data-val="${v}"
      aria-pressed="${S.cf[g].has(v)}">${esc(v)}</button>`;
  const th = (k,l)=>`<th data-sort="${k}">${l}${col===k?(dir>0?" ▲":" ▼"):""}</th>`;

  let prev = `<div class="insp"><div class="zero" style="padding:20px 8px"><p>Select a charter.</p></div></div>`;
  if (sel){
    const owner = byRef(sel.domain_ref), lr = lastRouted(sel.id), b = band(lr);
    const ps = PLACEMENTS.filter(p=>p.charter_id===sel.id);
    prev = `<div class="insp">
      <h4>${esc(sel.title)}</h4><div class="sub">${esc(sel.id)}</div>
      <p style="font-size:11.5px">${esc(sel.purpose)}</p>
      <div class="kv"><b>Owner</b><span>${owner?esc(dPath(owner.ref)+" "+owner.name):"—"}
        ${owner&&st(owner)==="retired"?'<span class="pill p-block">tombstone</span>':""}</span></div>
      <div class="kv"><b>Kind</b><span>${esc(sel.kind)} · ${esc(sel.status)}</span></div>
      <div class="kv"><b>Freshness</b><span><span class="pill ${b.cls}">${b.txt}</span></span></div>
      <div class="kv"><b>Superseded</b><span>${isSuperseded(sel)?"yes — derived from edges":"no"}</span></div>
      <div class="kv"><b>Routed</b><span class="num">${ps.length}</span></div>
      ${sel.scope_in&&sel.scope_in.length?`<h3 class="sec" style="margin:13px 0 6px">Scope in</h3>
        <p style="font-size:11.5px;margin:0">${sel.scope_in.map(esc).join(" · ")}</p>`:""}
      ${sel.scope_out&&sel.scope_out.length?`<h3 class="sec" style="margin:11px 0 6px">Out of scope</h3>
        <p style="font-size:11.5px;margin:0">${sel.scope_out.map(esc).join(" · ")}</p>`:""}
      <div class="legend">Freshness is derived at render from <code>max(placement.ts_ms)</code>.
        It is never stored — <code>last_routed_ms</code> has no writer.</div>
    </div>`;
  }
  return `
    <div class="facets">
      <span class="fl">Kind</span>${kinds.map(k=>fbtn("kind",k)).join("")}
      <span class="fl" style="margin-left:8px">Status</span>${stats.map(s=>fbtn("status",s)).join("")}
      <input type="search" id="q" placeholder="Search title and purpose…" value="${esc(S.q)}" style="margin-left:auto;width:210px">
    </div>
    <div class="cols"><div>
      ${fold("chart.table", "Charters", `${rows.length} of ${CHARTERS.length}`, `
      <div class="tw"><table><thead><tr>
        ${th("title","Charter")}${th("kind","Kind")}${th("status","Status")}${th("owner","Owner")}${th("fresh","Freshness")}
      </tr></thead><tbody>
      ${rows.length? rows.map(c=>{
        const o = byRef(c.domain_ref), b = band(lastRouted(c.id));
        return `<tr data-charter="${c.id}" class="${S.selCharter===c.id?"sel":""}">
          <td class="k">${esc(c.title)}${isSuperseded(c)?' <span class="pill p-mut">superseded</span>':""}</td>
          <td>${esc(c.kind)}</td>
          <td><span class="pill ${c.status==="active"?"p-ok":"p-mut"}">${esc(c.status)}</span></td>
          <td>${o?esc(dPath(o.ref)+" "+o.name):"—"}${o&&st(o)==="retired"?' <span class="pill p-block">tombstone</span>':""}</td>
          <td><span class="pill ${b.cls}">${b.txt}</span></td></tr>`;}).join("")
        : `<tr><td colspan="5"><div class="zero"><h4>No charter matches</h4>
             <p>Clear a filter to widen the search. The facet rail never disappears.</p></div></td></tr>`}
      </tbody></table></div>
      <p style="margin:9px 0 0;font-size:11px;color:var(--faint)">${rows.length} of ${CHARTERS.length}</p>`)}
    </div><div>${fold("chart.prev", "Preview", sel ? sel.title : "nothing selected", prev)}</div></div>`;
};

/* ── S3 Placements ── */
SCREENS.placements = () => {
  const modes = ["all","match","floor"];
  let rows = PLACEMENTS.filter(p=>S.pmode==="all"||p.mode===S.pmode);
  if (S.showAcme===false) rows = rows.filter(p=>p.tenant_id===META.tenant_id);
  rows = rows.slice().sort((a,b)=>b.ts_ms-a.ts_ms);
  const held = PLACEMENTS.filter(p=>p.mode==="floor");
  return `
    <div class="facets">
      <span class="fl">Mode</span>
      <span class="seg">${modes.map(m=>`<button type="button" data-pmode="${m}" aria-pressed="${S.pmode===m}">${m}</button>`).join("")}</span>
      ${TENANTS.length > 1 ? `<button class="btn" data-toggle="showAcme" aria-pressed="${S.showAcme}"
          style="margin-left:auto">Show other tenants</button>`
        : `<span style="margin-left:auto;font-size:10.5px;color:var(--faint)">one tenant in this
            registry — nothing to widen to</span>`}
    </div>
    ${held.length?`<div class="note w"><b>${held.length} held at ancestor.</b>
      These resolved below the ${CONFIDENCE_FLOOR} confidence floor, so the engine held them at the
      nearest live ancestor rather than guessing. They are not "unrouted" — that value has no writer.
      A run of these is the signal that the org is missing a department.</div>`:""}
    <div class="tw"><table><thead><tr>
      <th>Work</th><th>Filed to</th><th>Charter</th><th>Confidence</th><th>Mode</th><th>When</th>
    </tr></thead><tbody>
    ${rows.map(p=>{
      const d = byRef(p.domain_ref); const floor = p.mode==="floor";
      return `<tr class="${p.tenant_id!==META.tenant_id?"":""}" style="${p.tenant_id!==META.tenant_id?"border-left:2px solid var(--warn)":""}">
        <td class="k">${esc(p.work_ref.id)}</td>
        <td>${d?esc(dPath(d.ref)+" "+d.name):'<span class="pill p-block">unresolvable</span>'}</td>
        <td>${esc(p.charter_id||"—")}</td>
        <td class="num">${p.confidence.toFixed(2)}
          ${floor?'<span class="pill p-warn">held</span>':""}</td>
        <td>${esc(p.mode)}</td>
        <td class="num">${fmt(p.ts_ms)}</td></tr>`;}).join("")}
    </tbody></table></div>
    <div class="note" style="margin-top:12px"><b>Why an unfiled queue can exist at all.</b>
      <code>write_placement</code> rejects a null <code>charter_id</code>, so a floor placement is only
      recordable because the root holds a charter. A registry whose root has no charter cannot record
      one at all.</div>`;
};

/* ── S4 Knowledge (disabled) ── */
SCREENS.knowledge = () => {
  const r = S.searchRes;
  const body = !S.sq
    ? `<div class="zero"><h4>Search the registry</h4>
        <p>Departments, charters and filed work. Matches on names, descriptions,
        routing evidence, charter purpose and scope, and work paths — and tells you
        which field hit, so a result is explainable rather than an opaque rank.</p></div>`
    : S.searchBusy && !r
      ? `<p style="color:var(--muted)">Searching…</p>`
      : (!r || !r.results.length)
        ? `<div class="zero"><h4>No matches for “${esc(S.sq)}”</h4>
            <p>Nothing in the registry contains that term.</p></div>`
        : `<div class="facets">${Object.entries(r.counts).map(([k,n])=>
             `<span class="pill p-acc">${esc(k)} ${n}</span>`).join(" ")}
             ${r.truncated?`<span class="pill p-warn">showing first ${r.results.length}</span>`:""}</div>
           <div class="tw"><table><thead><tr>
             <th>Kind</th><th>Result</th><th>Matched on</th><th>Detail</th>
           </tr></thead><tbody>
           ${r.results.map(x=>`<tr ${x.kind==="domain"?`data-goto-domain="${esc(x.ref)}"`:""}
               style="${x.kind==="domain"?"cursor:pointer":""}">
             <td><span class="pill ${x.kind==="domain"?"p-acc":x.kind==="charter"?"p-ok":"p-mut"}">${esc(x.kind)}</span></td>
             <td class="k">${esc(x.path?x.path+" ":"")}${esc(x.title||"")}
               ${x.owner_retired?'<span class="pill p-block">tombstone</span>':""}
               ${x.status==="retired"?'<span class="pill p-block">retired</span>':""}</td>
             <td>${(x.matched_on||[]).map(f=>`<code>${esc(f)}</code>`).join(" ")}</td>
             <td>${esc((x.subtitle||"").slice(0,90))}</td></tr>`).join("")}
           </tbody></table></div>`;
  return `
    <div class="facets">
      <input type="search" id="sq" placeholder="Search departments, charters, filed work…"
             value="${esc(S.sq)}" style="width:100%;max-width:460px">
    </div>
    ${body}`;
};

/* ── S5 Reorg ── */
SCREENS.reorg = () => {
  const sim = simulate(S.draft.ops);
  const base = simulate([]);
  const blocking = sim.findings.filter(f=>f.sev==="block");
  const warns = sim.findings.filter(f=>f.sev==="warn");
  const ops = S.draft.ops;
  /* Either half of this screen can be un-answered: the draft simulation and
     the base simulation are two separate round trips. If either is pending or
     failed, every derived number on the strip is unknown — say so. */
  const pend = sim.pending || base.pending;
  const err  = sim.error || base.error;
  const n = v => (pend || err) ? "—" : v;
  return `
    <div class="facets">
      <span class="fl">Plan</span><code>${esc(PLANS[0].plan_id)}</code>
      <span class="pill p-mut">plan_origin: studio-drag</span>
      <span class="pill p-mut">validated_at_ms: null</span>
      <button class="btn" id="rebase" ${S.drift?"":"disabled"}>Rebase draft</button>
      <button class="btn" id="discard">Discard draft</button>
    </div>
    ${S.drift?`<div class="note b"><b>Registry changed since this draft captured its base.</b>
      1 event appended. <code>ORG-010</code> will block at apply. Rebasing re-captures the base and
      re-probes every op — the studio never silently refreshes it.</div>`:""}
    <div class="cols"><div>
      <h3 class="sec">Diff rail</h3>
      <div class="tw diff">
        ${ops.length? ops.map((o,i)=>{
          const s=byRef(o.ref), t=byRef(o.target);
          return `<div class="r"><span class="op">MOVE</span>
            <b style="color:var(--ink)">${esc(s?s.name:o.ref)}</b>
            <span>→ ${esc(t?t.name:o.target)}</span>
            <button class="btn" data-revert="${i}" style="margin-left:auto;padding:3px 7px">revert</button></div>`;
        }).join("")
        : `<div class="zero" style="padding:26px 12px"><h4>No operations yet</h4>
             <p>Switch Departments to <b>Draft</b> and drag a department onto a new parent.
             MOVE is the only gesture — every other operation needs per-item disposition a drop
             cannot carry.</p></div>`}
      </div>
      <div class="metrics">
        <div class="${!pend && !err && sim.domains2.filter(isLive).length!==base.domains2.filter(isLive).length?"chg":""}">departments<b>${n(base.domains2.filter(isLive).length)} <span class="ar">→</span> ${n(sim.domains2.filter(isLive).length)}</b></div>
        <div class="${!pend && !err && sim.findings.filter(f=>f.code==="ORG-001").length!==base.findings.filter(f=>f.code==="ORG-001").length?"chg":""}">overlaps<b>${n(base.findings.filter(f=>f.code==="ORG-001").length)} <span class="ar">→</span> ${n(sim.findings.filter(f=>f.code==="ORG-001").length)}</b></div>
        <div class="${!pend && !err && sim.maxDepth!==base.maxDepth?"chg":""}">max depth<b>${n(base.maxDepth)} <span class="ar">→</span> ${n(sim.maxDepth)}</b></div>
        <div>charters<b>${CHARTERS.length} <span class="ar">→</span> ${CHARTERS.length}</b></div>
      </div>
      <div class="findbar">
        ${err ? `<span style="color:var(--block)">✗ validation failed</span>`
          : pend ? `<span style="color:var(--muted)">checking…</span>`
          : `<span style="color:var(--block)">✗ ${blocking.length} blocking</span>
             <span style="color:var(--warn)">⚠ ${warns.length} warning</span>`}
        <span style="color:var(--muted)">${ops.length} changes</span>
      </div>
      <h3 class="sec" style="margin-top:14px">Rationale</h3>
      <input type="text" id="rat" placeholder="Required — becomes the changelog message"
             value="${esc(S.draft.rationale)}" style="width:100%">
      ${!S.draft.rationale && ops.length?`<p style="color:var(--block);font-size:11px;margin-top:6px">
        A rationale is required before this plan is complete.</p>`:""}
      <h3 class="sec" style="margin-top:14px">Effective</h3>
      <p style="font-size:11.5px">now (immediate) — <span class="pill p-mut">label, not a control</span>
        There is no scheduler: a Claude Code plugin has no daemon, and a back- or forward-dated stamp
        would corrupt the monotonic ordering replay depends on.</p>
      <h3 class="sec" style="margin-top:14px">There is no Apply button in this tier</h3>
      <p style="font-size:11.5px">Not disabled, not behind a confirm — absent. <code>org apply</code>
        is the only authority and it re-validates against freshly loaded state inside the RESTRUCTURE
        flock. The hazard is staleness: the tree gains system-minted siblings while you drag.</p>
      <div class="cmd"><span class="p">$</span><span class="t">placement_engine.py org plan --import ~/.sutra-ui/drafts/${esc(PLANS[0].plan_id)}.json</span>
        <button class="btn" id="copyCmd" style="padding:3px 8px">copy</button></div>
    </div><div>
      <h3 class="sec">Findings</h3>
      ${err? `<div class="note b"><b>Validation could not run.</b> ${esc(err)}<br>
        This list is empty because nothing was checked — not because nothing was found.
        Reload once the backend is answering.</div>`
      : pend? `<p style="color:var(--muted)">Checking… the validation pass is running
        server-side against a fresh read of the registry. No count until it answers.</p>`
      : sim.findings.length? sim.findings.map(f=>`
        <details class="code"><summary>
          <span class="cid" style="color:var(--${f.sev==="block"?"block":"warn"})">${f.code}</span>
          <span class="pill ${f.sev==="block"?"p-block":"p-warn"}">${f.sev}</span>
          <span style="color:var(--muted);overflow:hidden;text-overflow:ellipsis">${esc(f.subject)}</span>
        </summary><div class="in">${esc(f.subject)}</div></details>`).join("")
      : `<p style="color:var(--muted)">Nothing flagged on the current tree.</p>`}
      <div class="legend">All predicates live in one <code>simulate()</code>. Rings, the metric strip,
        Health and this list read the same <code>findings[]</code>.<br><br>
        Validation runs <b>server-side</b>: <code>POST /api/org/simulate</code> calls
        <code>reorg_sim.simulate()</code>, which reads the registry through the same
        <code>placement_engine</code> functions the CLI uses. Zero rules live in JS — the
        browser renders <code>findings[]</code>, it does not compute them.</div>
    </div></div>`;
};

/* ── S6 History ── */
SCREENS.history = () => {
  const rows = INDEX.slice().sort((a,b)=>b.ts_ms-a.ts_ms);
  const label = e => e.event==="domain_minted" ? `Minted ${e.name||e.ref.slice(0,12)}`
    : e.op==="retire" ? `Retired ${(e.before&&e.before.name)||e.ref.slice(0,12)}`
    : e.op==="rename" ? `Renamed ${e.ref.slice(0,12)}…`
    : `${e.op||e.event} ${e.ref?e.ref.slice(0,12)+"…":""}`;
  if (!rows.length) return `<div class="zero"><h4>No history yet</h4>
    <p>Nothing has been minted, renamed, moved or retired in this registry.
    <code>domains/INDEX.jsonl</code> is empty.</p></div>`;
  return `
    <ul class="tl">
      ${rows.map(e=>{
        const legacy = e.event==="domain_restructured" && !e.before;
        return `<li class="${legacy?"legacy":""}">
          <div class="when">${fmt(e.ts_ms)}${e.reorg_id?" · "+esc(e.reorg_id):""}</div>
          <div class="what">${esc(label(e))}</div>
          ${legacy?`<div class="det" style="color:var(--faint)">Legacy row — records that a change
            happened, not what it changed from. Enriched events carry before/after.</div>`:""}
          ${e.before&&e.after?`<div class="det">${esc(e.before.name)} → ${esc(e.after.name||e.before.name)}
            ${e.placements_repointed?` · ${e.placements_repointed} placement(s) repointed`:""}</div>`:""}
          ${e.event==="domain_restructured"&&!("tenant_id" in e)?`<div class="det" style="color:var(--faint)">
            No tenant_id on this event type — history cannot be partitioned by tenant.</div>`:""}
        </li>`;}).join("")}
    </ul>
    <div class="sepiaband">
      ${META.history_complete_from_ms
        ? `<b style="font-size:11.5px">Reconstructed before ${fmt(META.history_complete_from_ms)}.</b>
           <p style="margin:5px 0 0;font-size:11px">Rows prior to this date record that a change
           happened but not what it changed from. An as-of view before this date exits 2 rather
           than guessing — and as-of is private-report only.
           ${META.legacy_events?`<br>${META.legacy_events} legacy row(s) below the line.`:""}</p>`
        : `<b style="font-size:11.5px">No reconstructable history yet.</b>
           <p style="margin:5px 0 0;font-size:11px">Not one event carries a before/after snapshot,
           so nothing here can be replayed to reconstruct prior state — every row records only
           <i>that</i> something changed. An as-of view would exit 2 at any date.</p>`}
      <p style="margin:6px 0 0;font-size:10.5px;color:var(--faint)">This boundary is
      <b>derived</b> at read time from the earliest enriched event — it is not a stored
      field, because the engine has no such field to store.</p>
    </div>`;
};

/* ── S7 Health ── */
SCREENS.health = () => {
  const sim = simulate(S.draft.ops);
  const groups = {};
  sim.findings.forEach(f=>(groups[f.code]=groups[f.code]||[]).push(f));
  const held = PLACEMENTS.filter(p=>p.mode==="floor").length;
  return `
    <h3 class="sec">Evaluated</h3>
    ${sim.error? `<div class="note b"><b>Validation could not run.</b> ${esc(sim.error)}<br>
      Nothing below this line was evaluated. An empty findings list here is the
      absence of an answer, not a clean bill of health.</div>`
     : sim.pending? `<p style="color:var(--muted)">Checking… the validation pass is running
      server-side. No count, no green tick, until it answers.</p>`
     : Object.keys(groups).length? Object.entries(groups).sort().map(([code,fs])=>`
      <details class="code"><summary>
        <span class="cid" style="color:var(--${fs[0].sev==="block"?"block":"warn"})">${code}</span>
        <span class="pill ${fs[0].sev==="block"?"p-block":"p-warn"}">${fs[0].sev}</span>
        <span style="color:var(--muted)">${fs.length} subject${fs.length>1?"s":""}</span>
      </summary><div class="in">${fs.map(f=>"· "+esc(f.subject)).join("<br>")}</div></details>`).join("")
     : `<p style="color:var(--ok)">Nothing flagged.</p>`}

    <div class="legend">ORG-015 was dropped, not deferred — D-path is display-only and canon
      disclaims it as an identifier, so a code protecting it would teach the operator to defend a
      number the system does not promise.</div>`;
};

/* ── S8 Skills ──
   Grouped BY PROVIDER, because the entries are not interchangeable: a claude
   slash command is typed and runs; a codex SKILL.md is selected by that model
   and cannot be typed here; ~/.codex/AGENTS.md is standing instructions that
   are always loaded and never invoked at all. Flattening the three into one
   "commands" table would imply every row is runnable, and on this machine only
   the claude rows are. The per-provider header carries installed/configured and
   the server's own `note`, so a group with zero entries always says why. */
SCREENS.skills = () => {
  const q = (S.q||"").toLowerCase();
  const provs = SKILLS_META.providers || [];
  if (!provs.length && !SKILLS.length) return `<div class="zero"><h4>No capability files found</h4>
    <p>Nothing readable under any configured assistant's config directory.
    Install a plugin and reload.</p></div>`;
  const match = k => !q ||
    ((k.slash||"") + " " + (k.name||"") + " " + (k.description||"")).toLowerCase().includes(q);

  const KINDNOTE = {
    instructions: "always loaded as standing instructions — there is nothing to invoke",
    skill: "selected by the model, not typed",
    command: "typed in the composer",
    prompt: "typed in that assistant's own TUI"
  };

  const group = p => {
    const items = SKILLS.filter(k => k.provider === p.id);
    const shown = items.filter(match);
    const state = p.runnable
      ? `<span class="pill p-ok">runnable</span>`
      : `<span class="pill p-block">not runnable</span>`;
    const body = !items.length
      ? `<div class="zero" style="padding:18px 10px">
           <h4>Nothing read for ${esc(p.name)}</h4>
           <p>${esc(p.note || "no capability files")}</p></div>`
      : !shown.length
        ? `<p style="color:var(--faint);margin:0">No entry here matches “${esc(S.q)}”.</p>`
        : `<div class="tw"><table><thead><tr>
             <th>Entry</th><th>Kind</th><th>Source</th><th>Runnable</th><th>What it does</th>
           </tr></thead><tbody>
           ${shown.map(k=>`<tr>
             <td class="k">${k.slash
                 ? `<code>${esc(k.slash)}</code>`
                 : `<span style="color:var(--ink)">${esc(k.name)}</span>
                    <span class="pill p-mut">no slash</span>`}</td>
             <td>${esc(k.kind)}${k.always_loaded?' <span class="pill p-warn">always loaded</span>':""}</td>
             <td>${esc(k.source)}</td>
             <td class="whynot">${k.runnable ? `<span class="pill p-ok">yes</span>`
                   : `<span class="pill p-block">no</span>
                      <div style="font:500 9.5px/1.4 var(--mono);color:var(--faint);margin-top:3px">
                        ${esc(k.runnable_reason || KINDNOTE[k.kind] || "")}</div>`}</td>
             <td class="desc" title="${esc(k.description||"")}">${esc(k.description||"")}</td></tr>`).join("")}
           </tbody></table></div>
           <p style="margin:9px 0 0;font-size:11px;color:var(--faint)">
             ${shown.length} of ${items.length} · ${p.runnable_entries} runnable</p>`;
    return fold("skills." + p.id, p.name,
      `${items.length} entr${items.length===1?"y":"ies"}`,
      `<div class="facets" style="margin-bottom:9px">
         ${state}
         <span class="pill ${p.installed?"p-ok":"p-mut"}">binary ${p.installed?"on PATH":"missing"}</span>
         <span class="pill ${p.configured?"p-ok":"p-mut"}">config ${esc(p.config_dir)}${p.configured?"":" absent"}</span>
       </div>
       ${p.reason?`<div class="note w" style="margin-top:0"><b>Why nothing here runs.</b>
          ${esc(p.reason)}</div>`:""}
       ${p.note?`<p style="font-size:11px;color:var(--muted)">${esc(p.note)}</p>`:""}
       ${body}`,
      /* a provider with nothing to show starts folded — it is context, not content */
      items.length > 0);
  };

  return `
    <p>Every capability file each configured assistant actually exposes, read from its own
      config directory at request time — not a curated list. Only entries with a slash
      <i>and</i> a binary on PATH are offered in the composer's <code>/</code> palette.</p>
    <div class="facets">
      ${Object.entries(SKILLS_META.by_provider||{}).map(([k,n])=>
        `<span class="pill p-acc">${esc(k)} ${n}</span>`).join(" ")}
      ${Object.entries(SKILLS_META.by_kind||{}).map(([k,n])=>
        `<span class="pill p-mut">${esc(k)} ${n}</span>`).join(" ")}
      <span class="pill p-ok">${SKILLS_META.runnable==null?"—":SKILLS_META.runnable} runnable</span>
      <input type="search" id="q" placeholder="Filter entries…" value="${esc(S.q)}"
             style="margin-left:auto;width:200px">
    </div>
    ${provs.map(group).join("")}`;
};

/* ── S9 Tenants ──
   The counts are the SERVER's (GET /api/tenants runs tenant_refs/charters_for/
   all_placements per tenant); they are no longer re-derived here from whatever
   subset the current scope happened to fetch, which under a ?tenant= scope
   would have reported every other tenant as zero. */
SCREENS.tenants = () => {
  if (!TENANTS.length) return `<div class="zero"><h4>No tenants</h4>
    <p>${esc(S.tenantsError || "GET /api/tenants returned nothing.")}</p></div>`;
  return `
    <div class="facets">
      <span class="fl">Viewing</span><code>${esc(S.tenant||"—")}</code>
      <button class="btn" id="openGate" style="margin-left:auto">Switch tenant…</button>
    </div>
    <div class="note w"><b>Filtering is a scope, not a boundary.</b> Every request this panel makes
      carries <code>?tenant=</code>, and the engine's own <code>tenant_refs()</code> narrows the read.
      That is a misrouting guard — it is not access control, and the site generator still ignores
      <code>tenant_id</code>.</div>
    <div class="tw"><table><thead><tr>
      <th>Tenant</th><th>Root</th><th>Domains</th><th>Charters</th><th>Placements</th><th></th>
    </tr></thead><tbody>
    ${TENANTS.map(r=>`<tr class="${r.tenant_id===S.tenant?"sel":""}">
      <td class="k">${esc(r.tenant_id)}
        ${r.is_default?' <span class="pill p-acc">of record</span>':""}
        ${r.tenant_id===S.tenant?' <span class="pill p-ok">viewing</span>':""}</td>
      <td>${r.root_name?esc(r.root_name):'<span style="color:var(--faint)">none</span>'}</td>
      <td class="num">${r.domains}${r.domains_retired?` <span class="pill p-mut">${r.domains_retired} retired</span>`:""}</td>
      <td class="num">${r.charters}</td>
      <td class="num">${r.placements}</td>
      <td>${r.tenant_id===S.tenant?"":
          `<button class="btn" data-pick-tenant="${esc(r.tenant_id)}">View</button>`}</td>
    </tr>`).join("")}
    </tbody></table></div>
    <p style="margin-top:11px;font-size:11.5px;color:var(--muted)">There is no tenant table in the
      engine — a tenant is a <code>tenant_id</code> observed on a domain or a placement, so this list
      is derived on every request. The tenant of record (<code>PLACEMENT_TENANT</code>) is always
      listed even at zero counts, because it is where an unscoped write would land.</p>`;
};

/* ── S10 Settings ──
   Every control here acts. The provider list is the live one from
   GET /api/providers: `claude` is selectable, and the two that cannot run are
   RENDERED AND DISABLED with the server's exact `reason` beside them — not
   omitted. Hiding them would answer "can I use codex?" with silence; a
   selectable-but-broken entry would answer it with a dead websocket ten seconds
   later. Disabled-with-the-reason is the only version that answers it now. */
/* ── git ─────────────────────────────────────────────────────────────────────
   READ-ONLY, and says so. The endpoints behind this expose status/log/diff and
   nothing that mutates a repository, so this screen deliberately offers no
   stage/commit/push control -- an affordance that cannot work is worse than a
   missing one. The repo is the configured workdir, never a path from here. */
SCREENS.git = () => {
  if (S.gitError) return `<div class="zero"><h4>Git unavailable</h4>
    <p>${esc(S.gitError)}</p>
    <p style="font-size:11px;color:var(--faint)">The repository is the workdir set in
    Settings. Point it at a git checkout to use this screen.</p></div>`;
  if (!S.git) return `<div class="zero"><h4>Reading the repository…</h4></div>`;

  const st = S.git.status || {};
  const files = st.files || [];
  const sel = S.gitFile;
  const CODE = {M:"modified", A:"added", D:"deleted", R:"renamed", C:"copied", "?":"untracked", U:"conflicted"};
  const label = f => CODE[(f.y !== " " ? f.y : f.x)] || "changed";

  const row = f => `<button class="opt gitf ${sel===f.path?"sel":""}" type="button"
      data-gitfile="${esc(f.path)}">
      <span class="gcode ${f.y==="?"||f.x==="?"?"new":""}">${esc((f.x+f.y).trim()||"?")}</span>
      <span class="oi"><span class="on">${esc(f.path)}</span>
      <span class="od">${esc(label(f))}${f.x!==" "&&f.x!=="?"?" · staged":""}</span></span>
    </button>`;

  const diff = S.gitDiff == null
    ? (sel ? `<p style="color:var(--faint)">Reading diff…</p>` : "")
    : (S.gitDiff.trim()
        ? `<pre class="diff">${diffHtml(S.gitDiff)}</pre>${
            S.gitDiffTruncated?`<p class="note w" style="margin-top:6px">This diff was
            truncated at 400 KB. What is shown is the beginning of the real diff, not a
            summary of it.</p>`:""}`
        : `<p style="color:var(--faint)">No unstaged changes in this file. It may be
           staged already — this view shows the working tree against the index.</p>`);

  return `
    <div class="note" style="margin-bottom:9px"><b>Read-only.</b> This screen runs
      <code>git status</code>, <code>log</code> and <code>diff</code> against
      <code>${esc(S.git.repo || "—")}</code>. There is no stage, commit or push here:
      those write, and writes are gated separately.</div>

    ${fold("git.files", "Working tree", `${files.length} changed`, files.length
