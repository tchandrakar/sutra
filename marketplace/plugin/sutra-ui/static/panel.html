      ? `<div class="kv"><b>Branch</b><span><code>${esc(st.branch||"—")}</code></span></div>
         <div role="list" style="margin-top:7px">${files.map(row).join("")}</div>`
      : `<p style="color:var(--faint);margin:0">Nothing changed. The working tree is
         clean relative to the index.</p>`)}

    ${sel ? fold("git.diff", "Diff", esc(sel), diff) : ""}

    ${fold("git.log", "Recent commits", `${(S.git.commits||[]).length}`, (S.git.commits||[]).length
      ? `<div class="tw"><table><thead><tr><th>Commit</th><th>When</th><th>Author</th><th>Subject</th></tr></thead>
         <tbody>${S.git.commits.map(c=>`<tr>
           <td class="k"><code>${esc(c.short)}</code></td>
           <td>${esc(c.when)}</td><td>${esc(c.author)}</td>
           <td class="desc" title="${esc(c.subject)}">${esc(c.subject)}</td></tr>`).join("")}
         </tbody></table></div>`
      : `<p style="color:var(--faint);margin:0">No commits read.</p>`)}`;
};

/* Colour a unified diff. Line-based on purpose: a token-level differ would be a
   second, subtly different opinion about what changed from the one git already
   gave us, and this screen's job is to show git's answer. */
function diffHtml(text){
  return text.split("\n").slice(0, 4000).map(l=>{
    const c = l.startsWith("+++") || l.startsWith("---") ? "dh"
            : l.startsWith("@@") ? "dhunk"
            : l.startsWith("+") ? "dadd"
            : l.startsWith("-") ? "ddel"
            : l.startsWith("diff ") || l.startsWith("index ") ? "dh" : "";
    return `<span class="${c}">${esc(l)}</span>`;
  }).join("\n");
}

SCREENS.settings = () => {
  if (!SETTINGS) return `<div class="zero"><h4>Settings unavailable</h4>
    <p>${esc(S.runtimeError || S.setError || "GET /api/settings has not answered.")}</p>
    ${S.runtimeError?`<p style="font-size:11px;color:var(--faint)">The registry loaded; only the
      runtime call failed, so the rest of the panel is still live. Reload to retry.</p>`:""}</div>`;
  const st = SETTINGS;
  const active = st.provider;
  const banner = S.setError
    ? `<div class="note b"><b>The last change was refused.</b> ${esc(S.setError)}</div>`
    : S.setOk ? `<div class="note"><b>Saved.</b> ${esc(S.setOk)}</div>` : "";

  const provRow = p => `
    <button class="opt" type="button" role="radio"
        aria-checked="${active===p.id}" data-prov="${esc(p.id)}"
        ${p.runnable?"":"disabled"}
        ${S.setBusy==="prov:"+p.id?"aria-busy=\"true\"":""}>
      <span class="rd" aria-hidden="true"></span>
      <span class="oi">
        <span class="on">${esc(p.name)} <code>${esc(p.id)}</code>
          ${p.default?'<span class="pill p-mut">catalog default</span>':""}
          ${active===p.id?'<span class="pill p-ok">active</span>':""}
          ${S.setBusy==="prov:"+p.id?'<span class="pill p-acc">saving…</span>':""}</span>
        <span class="od">binary <code>${esc(p.bin)}</code>
          ${p.installed?`at <code>${esc(p.bin_path||"")}</code>`:"— not on PATH"} ·
          config <code>${esc(p.config_dir)}</code>${p.configured?"":" — absent"}</span>
        ${p.reason?`<span class="why">unavailable: ${esc(p.reason)}</span>`:""}
      </span>
    </button>`;

  /* `running` is the mode that actually reaches the spawn; `stored` is what is
     on file. They diverge when an unsafe mode was written without the
     out-of-band opt-in, and the row has to distinguish them -- labelling the
     stored value "active" is precisely the claim that was false. */
  const running = st.permission_mode_effective || st.permission_mode;
  const modeRow = m => `
    <button class="opt" type="button" role="radio"
        aria-checked="${running===m.id}" data-pmode-set="${esc(m.id)}"
        ${m.settable===false?'data-pmode-locked="1"':""}
        ${S.setBusy==="mode:"+m.id?"aria-busy=\"true\"":""}>
      <span class="rd" aria-hidden="true"></span>
      <span class="oi">
        <span class="on"><code>${esc(m.id)}</code>
          ${m.default?'<span class="pill p-mut">default</span>':""}
          ${m.writes_files?'<span class="pill p-block">writes files</span>':'<span class="pill p-ok">read-only</span>'}
          ${running===m.id?'<span class="pill p-ok">running</span>':""}
          ${st.permission_mode===m.id&&running!==m.id?'<span class="pill p-warn">on file · not honoured</span>':""}
          ${m.settable===false?'<span class="pill p-mut">locked</span>':""}
          ${S.setBusy==="mode:"+m.id?'<span class="pill p-acc">saving…</span>':""}</span>
        <span class="od">${esc(m.note||"")}</span>
        ${m.settable===false?`<span class="why">gated: the server must be started with
          <code>${esc(st.unsafe_modes_env||"SUTRA_UI_ALLOW_UNSAFE_PERM_MODES")}=1</code>
          before this can be selected.</span>`:""}
      </span>
    </button>`;

  /* Derived from what RUNS, not from what is stored. */
  const writes = (PERM_MODES.find(m=>m.id===running)||{}).writes_files;

  return `
    ${banner}
    ${fold("set.prov", "Provider", esc(active||"none runnable"), `
      <p style="margin-bottom:9px">Which AI CLI this panel drives. A provider is offered only when
        its binary is on PATH, it has a config directory, <i>and</i> this build has an adapter for it;
        the others stay listed, disabled, with the exact reason — so "can I use this one?" is answered
        here rather than by a chat that fails later. Installing a CLI is not enough on its own:
        the chat channel speaks Claude's stream-json protocol.</p>
      <div role="radiogroup" aria-label="Provider">${PROVIDERS.map(provRow).join("")}</div>
      <div class="kv"><b>Resolved via</b><span>${esc(st.provider_source||"—")}${
        st.provider_stored?` · stored <code>${esc(st.provider_stored)}</code>`:""}</span></div>
      ${(st.provider_ignored||[]).length?`<div class="note b" style="margin-bottom:0">
        <b>An override was NOT honoured.</b>
        ${st.provider_ignored.map(i=>`<div><code>${esc(i.source)}</code> asked for
          <code>${esc(i.id)}</code> — ${esc(i.reason)}</div>`).join("")}</div>`:""}
      ${PROVIDERS.filter(p=>p.runnable).length<2?`<p style="font-size:11px;color:var(--faint);margin:9px 0 0">
        ${PROVIDERS.filter(p=>p.runnable).length} of ${PROVIDERS.length} catalogued providers can run on
        this machine. The rest are shown above, disabled, with their reason — never silently missing.</p>`:""}`)}

    ${fold("set.mode", "Permission mode", esc(running||"—"), `
      ${st.permission_mode_clamped?`<div class="note w"><b>The stored mode is not the one running.</b>
        <code>${esc(st.permission_mode)}</code> is on file, but sessions start as
        <code>${esc(running)}</code>. ${esc(st.permission_mode_clamp_reason||"")}
        <div style="margin-top:6px">To honour it, restart the server with
        <code>${esc(st.unsafe_modes_env||"SUTRA_UI_ALLOW_UNSAFE_PERM_MODES")}=1</code> — the gate is
        deliberately out of band, because this endpoint is unauthenticated and anything that can
        reach the port could otherwise widen the agent's authority.</div></div>`:""}
      ${writes?`<div class="note b"><b>This mode lets the agent write files without asking.</b>
        With <code>${esc(running)}</code> running, a session started from this panel can
        create, change and delete files under the workdir below — and
        <code>bypassPermissions</code> also auto-approves shell commands. Nothing will prompt you
        per edit.</div>`:`<div class="note"><b>Read-only planning.</b> The agent proposes edits and
        you approve each one. Choosing <code>acceptEdits</code> below removes that prompt.</div>`}
      <div role="radiogroup" aria-label="Permission mode">${PERM_MODES.map(modeRow).join("")}</div>`)}

    ${fold("set.workdir", "Workdir", esc((st.workdir||"").split("/").pop()||"—"), `
      <p style="margin-bottom:9px">The directory every session this panel starts uses as its
        working directory. It is created if it does not exist. A change applies to the
        <b>next</b> session — moving a running agent out from under the transcript it is
        writing is not something this panel will do to you.</p>
      <div class="wdrow">
        <input type="text" class="wdin" data-workdir-input
               value="${esc(S.workdirDraft !== null ? S.workdirDraft : (st.workdir||""))}"
               spellcheck="false" autocapitalize="off" autocorrect="off"
               aria-label="Working directory" placeholder="~/sutra-ui-workspace">
        <button class="btn" type="button" data-workdir-save
          ${S.setBusy==="workdir"?'aria-busy="true" disabled':""}>${
            S.setBusy==="workdir"?"Saving…":"Use this directory"}</button>
      </div>
      <p style="font-size:11px;color:var(--faint);margin:7px 0 9px">Must sit inside
        <code>${esc(st.workdir_root||"~")}</code>. The chat session runs with this as its cwd, so an
        arbitrary path would turn this panel into a read oracle over the whole disk; widen the
        root with <code>SUTRA_UI_WORKDIR_ROOT</code> when starting the server if you need to.</p>
      <div class="kv"><b>In force</b><span><code>${esc(st.workdir||"—")}</code></span></div>
      <div class="kv"><b>Settings file</b><span><code>${esc(st.settings_path||"—")}</code>
        ${st.settings_file_exists?'<span class="pill p-ok">exists</span>'
                                 :'<span class="pill p-mut">not written yet</span>'}</span></div>
      ${Object.keys(st.invalid_stored_values||{}).length?`<div class="note w">
        <b>Ignored values in the settings file.</b>
        ${Object.entries(st.invalid_stored_values).map(([k,v])=>
          `<div><code>${esc(k)}</code> = <code>${esc(JSON.stringify(v))}</code></div>`).join("")}
        These were not silently corrected — the documented default is in force instead.</div>`:""}`)}`;
};

/* ── Staged department creation (§3.3). Four collapsible sections and a completion meter —
   NOT a Next/Back wizard. Nothing is minted at any step; the last step renders a CLI string. */
/* ══════════════════════ render ══════════════════════ */
const TITLES = {departments:["Departments","domains/*.json"],charters:["Charters","charters/C-<sha>.json"],
  placements:["Placements","CURRENT.jsonl"],knowledge:["Knowledge","live scan · domains · charters · placements"],
  reorg:["Reorg plans","plans/*.json"],history:["History","domains/INDEX.jsonl"],
  git:["Git","git status · log · diff — read-only, over the workdir"],
  health:["Health","lint · mece · verify-charters · stats"],
  skills:["Skills","~/.claude · ~/.codex — read at request time"],
  tenants:["Tenants","GET /api/tenants — derived, no tenant table"],
  settings:["Settings","~/.sutra-ui/settings.json · PATH"]};
/* ── a session's routing path, as a chart ──
   Honest model: the path is SUCCESSIVE PLACEMENT, not delegation. Each turn resolves to
   exactly one accountable department; departments never invoke one another (no such channel
   exists). The vertical chain is the ancestor path, which is real and is how charters are
   inherited; the numbered badges are which turn landed where. */
function routingChart(s){
  const touched = [...new Set(s.turns.filter(t=>t.domain).map(t=>t.domain.ref))];
  if (!touched.length) return s.turns.length
    ? `<div class="zero"><h4>No turn here carries a placement</h4>
        <p>Every turn in this session was read from a transcript on disk. They ran in the
        terminal, outside Sutra, so nothing classified them and there is no routing path to
        draw. Ask something below and that turn will have one.</p></div>`
    : `<p style="color:var(--faint)">No turns yet.</p>`;
  const chains = touched.map(ref=>{
    const chain=[]; let n=byRef(ref);
    while(n){ chain.unshift(n); n = n.parent_ref?byRef(n.parent_ref):null; }
    return chain;
  });
  const keep = new Set(); chains.forEach(c=>c.forEach(n=>keep.add(n.ref)));
  const roots = [...keep].map(byRef).filter(d=>!d.parent_ref||!keep.has(d.parent_ref));
  const kids = ref => [...keep].map(byRef).filter(d=>d.parent_ref===ref)
                        .sort((a,b)=>a.ts_minted_ms-b.ts_minted_ms);
  const turnsAt = ref => s.turns.map((t,i)=>({t,i})).filter(x=>x.t.domain&&x.t.domain.ref===ref);
  const node = d => {
    const ts = turnsAt(d.ref);
    const hit = ts.length>0;
    return `<button class="ocard ${hit?"hit":""}" data-ref="${d.ref}" style="min-width:118px">
      ${hit?`<span class="turnbadge">${ts.map(x=>x.i+1).join(",")}</span>`:""}
      <span class="odp">${esc(dPath(d.ref))}</span>
      <span class="onm">${esc(d.name)}</span>
      ${hit?`<span class="ometa"><span>${ts.map(x=>x.t.mode==="floor"?"held":x.t.confidence.toFixed(2)).join(" · ")}</span></span>`
           :`<span class="ometa"><span style="color:var(--faint)">passed through</span></span>`}
    </button>`;
  };
  const branch = d => `<li class="${kids(d.ref).length?"haskids":""}">${node(d)}
    ${kids(d.ref).length?`<ul>${kids(d.ref).map(branch).join("")}</ul>`:""}</li>`;
  return `
    <div class="chartwrap"><ul class="chart">${roots.map(branch).join("")}</ul></div>
    <div class="legend" style="margin-top:4px">
      Badges are turn numbers. A node with no badge is an <b>ancestor on the path</b>, not a
      participant — it is shown because charters inherit down this chain.
      <br><br><b>Departments do not hand work to each other.</b> There is no domain-to-domain
      channel in the engine. This path is successive placement: each turn was classified
      independently and filed to exactly one owner.
    </div>`;
}

/* The assistant half of a turn, rendered with the panel's OWN vocabulary — .turn .a for
   assistant prose, .pill for state, a compact tool row. Used for BOTH a live streaming
   reply and an assistant block replayed out of a transcript: in the second case
   `streaming` is false and `response` is already complete, so the same template renders
   it with no special case. */
function turnResponse(t){
  const nTools = (t.tools && t.tools.length) || 0;
  if (!t.streaming && !t.response && !t.error && !nTools) return "";
  const runs = t.toolRuns || [];
  const active = runs.filter(r=>r.running).length;
  const state = t.streaming
      ? `<span class="pill p-acc"><i class="dot"></i>${active ? active + " tool" + (active===1?"":"s") + " running"
                                                             : (t.thinking ? "thinking" : "running")}</span>`
      : (t.error ? `<span class="pill p-block">failed</span>`
                 : `<span class="pill p-ok">answered</span>`);
  /* Server-measured duration and cost, stated only when the server actually sent
     them. A turn replayed from a transcript has neither, and inventing a number
     there would be fabrication. */
  const meta = (!t.streaming && (t.duration_ms != null || t.cost_usd != null))
    ? `<span class="pill p-mut">${[
         t.duration_ms != null ? (t.duration_ms/1000).toFixed(1) + "s" : null,
         t.cost_usd != null ? "$" + Number(t.cost_usd).toFixed(4) : null,
       ].filter(Boolean).join(" · ")}</span>` : "";

  /* toolRuns (live, with lifecycle) is preferred; `tools` (flat names, which is all a
     replayed transcript records) is the fallback. A replayed turn therefore shows what
     ran but never claims a pass/fail it does not know. */
  const tools = runs.length
    ? `<div class="toolRow">${runs.slice(-12).map(r=>`
         <div class="trow ${r.running?"run":(r.ok===false?"bad":(r.ok===null?"unk":"ok"))}">
           <span class="tstate" aria-hidden="true"></span>
           <span class="tname">${esc(r.name)}</span>
           ${r.summary?`<span class="tsum">${esc(r.summary)}</span>`:""}
           ${r.caller && r.caller!=="direct"?`<span class="pill p-acc">${esc(r.caller)}</span>`:""}
           <span class="tverdict">${r.running ? "running"
                                   : r.ok === false ? "error"
                                   : r.ok === null ? "unknown"
                                   : "done"}</span>
         </div>`).join("")}</div>`
    : (nTools ? `<div class="toolRow" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">
      <span class="pill p-mut">${nTools} tool call${nTools===1?"":"s"}</span>
      ${[...new Set(t.tools)].slice(0,8).map(n=>`<span class="pill p-acc">${esc(n)}</span>`).join("")}
    </div>` : "");
  const waiting = (t.streaming && !t.response && !runs.length)
    ? `<div class="working"><i class="dot"></i>${t.thinking ? "Thinking" : "Working"}<b class="ell"></b></div>` : "";
  const body = t.response
    ? `<div class="md" style="margin-top:6px;color:var(--ink)">${mdHtml(t.response)}${
        t.streaming ? `<span style="color:var(--acc)">█</span>` : ""}</div>` : "";
  /* the REAL failure text, never a fabricated answer and never nothing */
  const err = t.error
    ? `<div style="margin-top:6px;color:var(--block);white-space:pre-wrap">${esc(t.error)}</div>` : "";
  return `<div class="a">${state}${meta}${tools}${waiting}${body}${err}</div>`;
}
/* One turn. Two provenances, told apart on purpose:
   - a turn the PANEL ran carries a placement (or an honest reason it has none)
   - a turn READ FROM A TRANSCRIPT carries none, because none was ever computed:
     it ran in the terminal, outside Sutra. Filling that slot with "Unresolved —
     no department could be resolved" would report a classification failure that
     never happened. */
function turnBlock(t, i){
  if (t.transcript){
    return `<div class="turn">
      ${t.orphan
        ? `<div class="a"><span class="pill p-warn">assistant message with no recorded prompt</span></div>`
        : `<div class="u md">${mdHtml(t.text)}</div>`}
      <div class="a">
        <span class="pill p-mut">turn ${i+1} · from transcript</span>
        <div style="margin-top:5px;color:var(--faint);font-size:11px">Read from
          <code>~/.claude/projects</code>. This ran in the terminal, not through this panel,
          so no placement was ever filed for it.</div>
      </div>${turnResponse(t)}</div>`;
  }
  return `<div class="turn">
    <div class="u md">${mdHtml(t.text)}</div>
    <div class="a">
      ${t.domain?`<span class="fchip ${t.mode==="floor"?"held":""}">turn ${i+1} · ${esc(dPath(t.domain.ref))} ${esc(t.domain.name)}${t.mode==="floor"?" · held at ancestor":" · "+t.confidence.toFixed(2)}</span><br>`:""}
      ${!t.domain
        /* mode "none": there is no department. The old template still printed
           "Filed to ." — an empty owner dressed as a filing. Say what happened. */
        ? `<b style="color:var(--block)">Unresolved</b> — no department could be
           resolved, so this ran without a charter.${t.blocked?` <span style="color:var(--faint)">${esc(t.blocked)}</span>`:""}`
        /* classified, but write_placement refused (no reachable charter, I-P2).
           A department was chosen; nothing was filed. Both halves are true and
           "Filed to X" alone is the false one. */
        : (t.blocked && !t.placement
          ? `Classified to <b style="color:var(--ink)">${esc(t.domain.name)}</b>, but
             <b style="color:var(--block)">nothing was filed</b> —
             <span style="color:var(--faint)">${esc(t.blocked)}</span>`
          : (t.mode==="floor"
            ? `No department claims this, so it was held at the nearest live ancestor rather than guessed.`
            : `Filed to <b style="color:var(--ink)">${esc(t.domain.name)}</b>${t.matched&&t.matched.length?` on <code>${t.matched.map(esc).join("</code> <code>")}</code>`:""}.`))}
      ${t.charter?`<div class="ground" style="margin-top:7px"><b>Grounding</b> —
        <span style="color:var(--acc);font-family:var(--mono);font-size:10px">${esc(t.charter.id)}</span>
        ${esc(t.charter.title)}<br><span style="font-style:italic">${esc(t.charter.purpose)}</span></div>`:""}
    </div>${turnResponse(t)}</div>`;
}

/* Chat body. A real session that has no readable transcript gets an HONEST
   empty state naming which of the four things happened — unread, reading,
   unreadable, or genuinely empty. None of them fabricates a turn. */
function sessionBody(s){
  if (s.turns.length) return s.turns.map(turnBlock).join("");
  if (s.real){
    if (s.loadState === "loading")
      return `<p style="color:var(--muted)">Reading the transcript…</p>`;
    if (s.loadState === "error")
      return `<div class="zero"><h4>The transcript could not be read</h4>
        <p>${esc(s.loadError || "GET /api/sessions/" + s.id + " failed.")}</p>
        <p style="color:var(--faint)">The session is listed because the file exists under
        <code>~/.claude/projects</code>; nothing is shown because nothing could be parsed
        out of it. No turns have been invented to fill the gap.</p></div>`;
    if (s.loadState === "empty")
      return `<div class="zero"><h4>No readable turns in this transcript</h4>
        <p>The file parsed, but it holds no user or assistant messages — a session that was
        opened and abandoned, or one whose content is entirely tool traffic.</p></div>`;
    return `<p style="color:var(--muted)">Transcript not read yet.</p>`;
  }
  return `<div class="zero"><h4>Nothing asked yet</h4>
    <p>Type below. The turn is classified and filed to a department before any work starts.</p></div>`;
}

function sessionPane(s){
  const tab = S.sessTab[s.id] || "chat";
  const collapsed = !!S.ui.paneCollapsed[s.id];
  const last = s.turns[s.turns.length-1];
  const chip = last && last.domain
    ? `<span class="fchip ${last.mode==="floor"?"held":""}">${esc(dPath(last.domain.ref))} ${esc(last.domain.name)}${last.mode==="floor"?" · held":" · "+last.confidence.toFixed(2)}</span>`
    : "";
  /* what the server said it would actually run, from the ws "provider" frame */
  const ch = s.channel;
  const chanChip = ch ? `<span class="pill ${ch.writes_files?"p-block":"p-mut"}">${esc(ch.id)} ·
      ${esc(ch.permission_mode||"")}${ch.writes_files?" · writes files":""}</span>` : "";
  const body = tab==="route" ? routingChart(s) : sessionBody(s);
  return `<section class="pane ${collapsed?"collapsed":""}" data-sess="${s.id}">
    <div class="ph">
      <button class="pfold" type="button" data-pane-fold="${esc(s.id)}"
              aria-expanded="${!collapsed}"
              aria-label="${collapsed?"Expand":"Collapse"} this session pane">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <span class="dot run" aria-hidden="true" style="width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none"></span>
      <h3 title="${esc(s.title)}${s.real&&s.cwd?" — "+esc(s.cwd):""}">${esc(s.title)}</h3>
      ${s.real?`<span class="src">transcript</span>`:""}
      <span class="tabs">
        <button type="button" data-tab="chat"  data-sid="${s.id}" aria-pressed="${tab==="chat"}">Chat</button>
        <button type="button" data-tab="route" data-sid="${s.id}" aria-pressed="${tab==="route"}">Routing</button>
      </span>
      <button class="ib" data-close="${s.id}" aria-label="Close session">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="pb">${chip||chanChip?`<div style="margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap">${chip}${chanChip}</div>`:""}${body}</div>
    ${S.palette && S.palette.sid===s.id ? paletteHtml() : ""}
    <div class="pc">
      <input type="text" data-sask="${s.id}" value="${esc(S.composerText[s.id]||"")}"
             placeholder="Ask anything — / for commands"
             aria-label="Continue this session"/>
      <button class="send" data-ssend="${s.id}" type="button" aria-label="Send">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div></section>`;
}

/* render() does a full innerHTML rebuild, and now some rebuilds are triggered by an
   ASYNC event (a simulate()/loadOrg() fetch resolving) rather than direct user action --
   unlike the earlier fully-synchronous build, a background render can now land while the
   operator is mid-keystroke in the composer, the rationale field, search, or the create-
   department form. Without this, that re-render silently wipes whatever they just typed
   (the click-send handler reads an emptied input and no-ops with no error, no request,
   no visible failure). Capture the focused input's identity + value + caret before
   rebuilding, restore it after -- covers every text input uniformly, not just the ones
   with bespoke keep() handlers. */
function _focusedInputSelector(){
  const el = document.activeElement;
  if (!el || !(el.tagName === "INPUT" || el.tagName === "SELECT")) return null;
  if (el.id) return "#" + el.id;
  for (const attr of ["data-sask", "data-ssend"]) {
    if (el.hasAttribute(attr)) return "[" + attr + '="' + el.getAttribute(attr) + '"]';
  }
  return null;
}
/* ── "/" palette: real slash commands in the composer ──────────────────────
   Typing "/" used to insert a character and offer nothing. The list is the same
   catalog the Skills screen shows (GET /api/skills), so the palette can only ever
   offer something that actually resolves -- and only the RUNNABLE half of it.
   Rendered into the pane body, reusing .tw/.legend. */
/* Only RUNNABLE slash commands are offered. Two filters, both necessary:
     k.slash      -- codex's AGENTS.md and its SKILL.md entries have none. They
                     are real capability files, but nothing is typed to invoke
                     them, so a palette row for them would resolve to nothing.
     k.runnable   -- the provider that resolves the command must have its binary
                     on PATH. ~/.codex existing is not evidence that `codex` does.
   The Skills screen still lists everything, disabled and with the reason. The
   palette is the place where offering something means it will run. */
const runnableCommands = () => SKILLS.filter(k => k.slash && k.runnable);
function paletteFor(text){
  const m = /(^|\s)\/([A-Za-z0-9:_-]*)$/.exec(text || "");
  if (!m) return null;
  const token = m[2].toLowerCase();
  const items = runnableCommands().filter(k =>
    k.slash.slice(1).toLowerCase().includes(token) ||
    (k.name||"").toLowerCase().includes(token)).slice(0, 8);
  return { token, items };
}
function paletteHtml(){
  const p = S.palette;
  if (!p || !p.items.length) return "";
  return `<div class="tw" style="margin-bottom:9px">
    <table><tbody>${p.items.map((k,i)=>`
      <tr data-pal="${i}" class="${i===p.idx?"sel":""}" style="cursor:pointer">
        <td class="k" style="white-space:nowrap"><code>${esc(k.slash)}</code></td>
        <td>${esc((k.description||"").slice(0,72))}</td></tr>`).join("")}
    </tbody></table>
    <div class="legend" style="padding:6px 9px">up/down to move · enter or tab to insert ·
      esc to dismiss · ${p.items.length} of ${runnableCommands().length} runnable</div></div>`;
}
function applyPalette(sid, idx){
  const p = S.palette; if (!p || !p.items[idx]) return;
  const inp = document.querySelector('[data-sask="'+sid+'"]'); if (!inp) return;
  /* Compute the new value FIRST, render, THEN write it back. Setting it before
     render() lost it entirely: render() rebuilds the pane from the template and
     only restores the value of the element that happened to be focused, so a
     CLICKED palette row (input not focused) silently cleared the composer. */
  const cur = S.composerText[sid] !== undefined ? S.composerText[sid] : inp.value;
  const next = cur.replace(/(^|\s)\/[A-Za-z0-9:_-]*$/,
                           (mm, pre)=> pre + p.items[idx].slash + " ");
  S.composerText[sid] = next;
  S.palette = null;
  render();
  const back = document.querySelector('[data-sask="'+sid+'"]');
  if (back) { back.value = next; back.focus();
              back.setSelectionRange(next.length, next.length); }
}

/* Knowledge search -- debounced, server-side. */
let _sqT = null;
function runSearch(q){
  S.sq = q;
  clearTimeout(_sqT);
  if (!q.trim()){ S.searchRes = null; S.searchHits = null; S.searchBusy = false; render(); return; }
  S.searchBusy = true;
  _sqT = setTimeout(()=>{
    apiGet("/api/org/search?q=" + encodeURIComponent(q) + "&limit=40&" + tenantQ())
      .then(r => { S.searchRes = r; S.searchHits = r.results.length; S.searchBusy = false; render(); })
      .catch(e => { S.searchRes = { query:q, results:[], counts:{}, error:e.message };
                    S.searchHits = 0; S.searchBusy = false; render(); });
  }, 250);
}

/* ══════════════════════ tenant gate ══════════════════════
   Tenant-first: nothing about departments, charters or placements is fetched
   or drawn until the scope those numbers belong to has been chosen, because
   "2 domains, 38 placements" is meaningless without saying whose.

   ONE-TENANT BEHAVIOUR (deliberate, and this registry is that case): when
   GET /api/tenants returns exactly one row, boot() selects it and goes
   straight to the panel. A chooser with a single option is not a choice — it
   is a click charged on every load for no information. The chooser is still
   reachable at any time from the rail footer, and it renders the same way for
   one tenant as for ten, so the mechanism is visible rather than hidden.
   With two or more tenants and nothing remembered, the gate blocks the load. */
function tenantGateHtml(){
  const cur = S.tenant;
  const cards = TENANTS.map(r=>`
    <button class="tcard" type="button" data-pick-tenant="${esc(r.tenant_id)}"
            aria-current="${cur===r.tenant_id}">
      <span class="tid">${esc(r.tenant_id)}
        ${r.is_default?'<span class="pill p-acc">of record</span>':""}
        ${cur===r.tenant_id?'<span class="pill p-ok">current</span>':""}</span>
      <span class="tm">
        <span>${r.domains} domain${r.domains===1?"":"s"}</span>
        <span>${r.charters} charter${r.charters===1?"":"s"}</span>
        <span>${r.placements} placement${r.placements===1?"":"s"}</span>
        <span>${r.root_name?"root: "+esc(r.root_name):"no root"}</span>
      </span>
    </button>`).join("");
  return `<section class="pane browse">
    <div class="ph"><h3 style="max-width:none">Choose a tenant</h3>
      <span class="src">GET /api/tenants</span></div>
    <div class="pb">
      <p>Every request this panel makes is scoped to one tenant. Pick the one you are
        working in; it is remembered until you change it here.</p>
      ${S.tenantsError?`<div class="note b"><b>Could not list tenants.</b>
        ${esc(S.tenantsError)}</div>`:""}
      ${TENANTS.length?`<div class="tgate">${cards}</div>`:`
        <div class="zero"><h4>No tenants</h4><p>The registry reported none.</p></div>`}
      ${TENANTS.length===1?`<p style="font-size:11px;color:var(--faint);margin-top:12px">
        This registry holds exactly one tenant, so it is selected automatically on load —
        you are seeing this screen because you asked for it. It is not padded with
        placeholder tenants to make the list look fuller.</p>`:""}
      ${S.tenant?`<div style="margin-top:14px">
        <button class="btn" id="gateCancel">Keep <code>${esc(S.tenant)}</code> and go back</button>
      </div>`:""}
    </div></section>`;
}

/* ── first run ───────────────────────────────────────────────────────────────
   Four facts the operator needs BEFORE the panel starts driving a CLI on their
   machine, each read from the same endpoint the corresponding screen uses:
   which assistant runs, where it works, what it is allowed to do, what it can
   see. Every value is live -- there is no illustrative copy here, so a machine
   with no `claude` on PATH is told that on step 1 instead of after its first
   message dies. Dismissing writes settings.onboarded=true server-side; a
   browser flag would re-show this on another browser and skip it after a
   settings reset, and this is exactly the disclosure that must not be skipped. */
function onboardingHtml(){
  const st = SETTINGS || {};
  const running = st.permission_mode_effective || st.permission_mode || "plan";
  const runnable = PROVIDERS.filter(p=>p.runnable);
  const active = PROVIDERS.find(p=>p.id===st.provider) || runnable[0] || null;
  const blocked = PROVIDERS.filter(p=>!p.runnable);
  const tn = (TENANTS||[]).find(t=>t.tenant_id===S.tenant) || {};
  const writes = running !== "plan";

  const step = (n, title, body) => `<div class="onb-step">
    <span class="onb-num">${n}</span><div class="onb-b">${title}${body}</div></div>`;

  return `<div class="onb" role="dialog" aria-modal="true" aria-label="Welcome to Sutra">
    <div class="onb-card">
      <h1>Welcome to Sutra</h1>
      <p class="onb-lede">A reader for your placement registry — the departments, charters and
        placements your work is filed into — with an assistant alongside it. Four things worth
        knowing before you start. All of them are live readings from this machine, not examples.</p>

      ${step(1, `<h3>${active
          ? `It drives <code>${esc(active.name)}</code>`
          : "No assistant can run here yet"}</h3>`,
        active
          ? `<p>Chat in this panel spawns your local <code>${esc(active.bin)}</code> CLI and bills as
               your existing subscription — never an API key.</p>
             <div class="onb-fact">${esc(active.bin_path||"")}</div>`
          : `<p>None of the ${PROVIDERS.length} catalogued assistants is usable on this machine, so
               chat is unavailable. Everything else — departments, charters, placements — still works.</p>
             ${blocked.map(p=>`<div class="onb-fact">${esc(p.name)} — ${esc(p.reason||"")}</div>`).join("")}`)}

      ${step(2, `<h3>It works in one directory</h3>`,
        `<p>Every session this panel starts runs with this as its working directory. It is created
           if it does not exist.</p>
         <div class="onb-fact">${esc(st.workdir||"—")}</div>`)}

      ${step(3, `<h3>${writes
          ? "The assistant can change files"
          : "The assistant proposes, you approve"}</h3>`,
        `<p>${writes
            ? `Sessions run as <code>${esc(running)}</code> — edits under the workdir are applied
               without prompting you first.`
            : `Sessions run as <code>${esc(running)}</code>: it reads and plans, and every edit needs
               your approval. You can widen this in Settings.`}</p>
         ${st.permission_mode_clamped?`<div class="onb-fact">note: <code>${esc(st.permission_mode)}</code>
           is on file but is not honoured — sessions run as <code>${esc(running)}</code></div>`:""}`)}

      ${step(4, `<h3>It reads what is already on your disk</h3>`,
        `<p>The registry below, and every slash command your assistant can already resolve. Nothing
           was seeded or invented for this screen.</p>
         <div class="onb-fact">${esc(S.tenant||"—")} · ${tn.domains??0} departments ·
           ${tn.charters??0} charters · ${tn.placements??0} placements ·
           ${(SKILLS_META&&SKILLS_META.total)||0} commands</div>`)}

      <div class="onb-foot">
        <span class="sp">You can change any of this later in Settings.</span>
        <button class="onb-skip" type="button" data-onb="later">Not now</button>
        <button class="onb-go" type="button" data-onb="done">Start using Sutra</button>
      </div>
    </div></div>`;
}

/* Mounted OUTSIDE #app so render()'s wholesale replacement of #panes cannot
   tear it down mid-interaction. */
function renderOnboarding(){
  let host = document.getElementById("onbHost");
  const show = !!(SETTINGS && SETTINGS.onboarded === false && !S.onbDismissed);
  if (!show){ if (host) host.remove(); return; }
  if (!host){
    host = document.createElement("div");
    host.id = "onbHost";
    document.body.appendChild(host);
  }
  host.innerHTML = onboardingHtml();
  host.querySelectorAll("[data-onb]").forEach(b=>b.onclick=()=>{
    /* "Not now" hides it for this load only and does NOT persist -- the
       disclosure returns next launch, because it was never acknowledged. */
    if (b.dataset.onb === "later"){ S.onbDismissed = true; renderOnboarding(); return; }
    S.onbDismissed = true;
    renderOnboarding();
    apiPost("/api/settings", { onboarded: true })
      .then(r=>{ SETTINGS = r.settings || SETTINGS; })
      .catch(()=>{ /* the panel is usable either way; it simply shows again next launch */ });
  });
}

function render(){
  /* A drag is a live binding between the dragged node and the drop targets'
     ondragover/ondrop handlers. render() replaces #panes wholesale, so a
     background render (a simulate() fetch resolving mid-gesture) swaps every
     node under the cursor for a fresh one with no handlers attached yet: the
     drop then silently never fires and the operator's move is lost with no
     error. Defer; dragend/drop flushes it. */
  if (S.drag){ S.renderDirty = true; return; }
  S.renderDirty = false;
  const sel = _focusedInputSelector();
  const prior = sel ? { sel, value: document.activeElement.value,
    start: document.activeElement.selectionStart, end: document.activeElement.selectionEnd } : null;

  renderRail();
  renderOnboarding();

  /* No tenant GATE pane. Choosing a workspace is a footer control, not a
     full-screen interstitial: with one tenant the interstitial was a click that
     carried no information, and it hijacked every screen behind it. boot()
     auto-selects, so S.tenant is set by the time we render. */
  document.getElementById("app").classList.toggle("railcol", !!S.ui.railCollapsed);

  const [t,src] = TITLES[S.screen];
  const open = S.openPanes.map(id=>S.sessions.find(s=>s.id===id)).filter(Boolean);
  const bCol = !!S.ui.paneCollapsed.browse;
  /* a dragged width wins over the default flex ratio; without a drag the pane
     keeps the original `flex:1 1 480px` and nothing about the layout changed.

     CLAMPED to the CURRENT window, not the one it was dragged in. The width is
     persisted, so a pane widened on a 1600px display came back at that width
     on a 1000px one: the pane overflowed .panes, the session pane next to it
     was pushed out of sight, and the only way back was a sideways scroll to
     find a divider that was itself off-screen. Same ceiling the drag itself
     uses (leave >=170px for the session pane), so the restored width can never
     be one the drag would have refused. The stored value is left alone -- go
     back to the wide display and the original width returns. */
  /* A pinned width is only meaningful when there is ANOTHER expanded pane to
     share the row with. Pinning unconditionally was the dead-space bug: with a
     single pane (session closed, or every session pane collapsed) the browse
     pane sat at its dragged width -- measured 453px inside a 1061px row, 608px
     of the container simply unclaimed, because `flex:0 0 <px>` sets flex-grow
     to 0 and nothing else was left to grow. The stored width is NOT discarded;
     it is just not applied while it would strand space. Reopen a session and
     the drag width returns. */
  const expandedSessions = open.filter(s => !S.ui.paneCollapsed[s.id]).length;
  const pinBrowse = !bCol && S.ui.browseW && expandedSessions > 0;
  /* COLLAPSED emits NO inline flex. `.pane.collapsed` already pins the rail to
     38px, but an inline style beats a stylesheet rule, so the old unconditional
     `flex:1 1 auto` overrode it and the collapsed rail GREW to fill the row --
     a 38px strip stretched across ~600px with its vertical label floating in
     the middle. Letting the class own the collapsed width is the whole fix. */
  const bStyle = bCol
    ? ""
    : pinBrowse
      ? ` style="flex:0 0 ${clampBrowseW(S.ui.browseW)}px;max-width:none"`
      : ` style="flex:1 1 auto;max-width:none"`;
  document.getElementById("panes").innerHTML =
    `<section class="pane browse ${bCol?"collapsed":""}"${bStyle}>
       <div class="ph">
         <button class="pfold" type="button" data-pane-fold="browse"
                 aria-expanded="${!bCol}"
                 aria-label="${bCol?"Expand":"Collapse"} the browse pane">
           <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
         </button>
         <h3 style="max-width:none">${esc(t)}</h3>
         </div>
       <div class="pb" id="scBody"></div>
     </section>`
    + (open.length && !bCol
        ? `<button class="pdiv" id="pdiv" type="button" role="separator"
             aria-orientation="vertical" aria-label="Resize the browse pane
             (left and right arrows adjust, home resets)"></button>` : "")
    + open.map(sessionPane).join("");
  document.getElementById("scBody").innerHTML = SCREENS[S.screen]();
  wire();

  if (prior) {
    const el = document.querySelector(prior.sel);
    if (el && (el.tagName === "INPUT")) {
      el.value = prior.value;
      el.focus();
      if (typeof prior.start === "number" && el.setSelectionRange) {
        try { el.setSelectionRange(prior.start, prior.end); } catch (e) {}
      }
    }
  }
  /* AFTER #panes is populated -- scrollHeight is meaningless before layout. */
  scrollNewSessionsToNewest();
}
/* A transcript is a LOG: the interesting end is the newest turn. Opening a
   60-turn session at turn 1 makes the operator scroll to find what just
   happened. Scroll once per pane-open, then leave the scroll position alone so
   a re-render (a streaming token, a sim result) never yanks the view back. */
function scrollNewSessionsToNewest(){
  const open = new Set(S.openPanes);
  [...S.userScrolled.keys()].forEach(id => { if (!open.has(id)) S.userScrolled.delete(id); });
  requestAnimationFrame(()=>{
    document.querySelectorAll("#panes .pane[data-sess]").forEach(pane=>{
      const sid = pane.dataset.sess;
      const pb = pane.querySelector(".pb");
      if (!pb || pb.__sutraBound) return;
      pb.__sutraBound = true;
      /* Distinguish OUR scroll from the operator's: only a scroll we did not
         cause counts as intent. Landing back at the bottom clears it again. */
      pb.addEventListener("scroll", ()=>{
        if (pb.__pinning) return;
        const atBottom = pb.scrollHeight - pb.clientHeight - pb.scrollTop < 24;
        if (atBottom) S.userScrolled.delete(sid); else S.userScrolled.set(sid, true);
      }, { passive:true });
    });
    /* Fixed timeouts do not work here. Transcripts range from 2 turns to ~1MB,
       and layout finishes whenever it finishes -- a 120/400/900ms ladder pinned
       three sessions and missed the largest. FOLLOW THE LAYOUT instead: poll
       scrollHeight and re-pin every time it grows, stopping when it stops
       changing, when the operator scrolls, or after a hard 4s ceiling so this
       can never become a permanent timer. */
    document.querySelectorAll("#panes .pane[data-sess]").forEach(pane=>{
      const sid = pane.dataset.sess;
      const pb = pane.querySelector(".pb");
      if (!pb || pb.__pinTimer) return;
      let lastH = -1, stable = 0, ticks = 0;
      pb.__pinTimer = setInterval(()=>{
        ticks++;
        const done = () => { clearInterval(pb.__pinTimer); pb.__pinTimer = null; };
        if (S.userScrolled.get(sid) || ticks > 40) return done();   // 4s ceiling
        const h = pb.scrollHeight;
        if (h <= pb.clientHeight + 1) return;                       // nothing yet
        if (h === lastH){ if (++stable >= 3) done(); return; }       // settled
        lastH = h; stable = 0;
        pb.__pinning = true;
        pb.scrollTop = h;                                            // newest turn is last
        setTimeout(()=>{ pb.__pinning = false; }, 0);
      }, 100);
    });
  });
}

/* Run whatever render() was deferred during a drag. Called from dragend and
   from every early-return path in ondrop, so a deferred render can never be
   stranded. */
function flushRender(){ if (S.renderDirty) render(); }
/* the tenant chooser is its own tiny wiring pass -- it renders instead of the
   screens, so wire() (which assumes #scBody exists) must not run for it */
function wireGate(){
  const panes = document.getElementById("panes");
  panes.querySelectorAll("[data-pick-tenant]").forEach(b=>
    b.onclick = ()=>pickTenant(b.dataset.pickTenant));
  const c = panes.querySelector("#gateCancel");
  if (c) c.onclick = ()=>{ S.gate = false; render(); };
}

/* Drag the browse/session divider. The drag writes the width straight onto the
   element instead of re-rendering per mousemove -- a full innerHTML rebuild at
   60Hz would tear down the very button being dragged. State is persisted once,
   on mouseup. Arrow keys do the same thing for keyboard users; Home clears the
   override and returns the pane to its default flex ratio. */
function wireDivider(){
  const d = document.getElementById("pdiv");
  if (!d) return;
  const panes = document.getElementById("panes");
  const browse = panes.querySelector(".pane.browse");
  if (!browse) return;
  const apply = w => { S.ui.browseW = Math.round(w);
    browse.style.flex = "0 0 " + Math.round(w) + "px"; browse.style.maxWidth = "none"; };
  /* The SAME ceiling render() applies to a restored width -- a drag must not
     be able to reach a width the next reload would clamp away. */
  const limit = browseMax;
  d.onmousedown = e => {
    e.preventDefault();
    d.classList.add("dragging");
    const startX = e.clientX, startW = browse.getBoundingClientRect().width;
    const move = ev => apply(Math.max(BROWSE_MIN, Math.min(limit(), startW + (ev.clientX - startX))));
    const up = () => {
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      d.classList.remove("dragging");
      saveLayout();
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  };
  d.onkeydown = e => {
    const cur = S.ui.browseW || browse.getBoundingClientRect().width;
    if (e.key === "ArrowLeft"){ e.preventDefault(); apply(Math.max(BROWSE_MIN, cur - 24)); saveLayout(); }
    else if (e.key === "ArrowRight"){ e.preventDefault(); apply(Math.min(limit(), cur + 24)); saveLayout(); }
    else if (e.key === "Home"){ e.preventDefault(); S.ui.browseW = null; saveLayout(); render(); }
  };
}

function wire(){
  const scBody = document.getElementById("scBody");
  const panes  = document.getElementById("panes");

  /* ── layout affordances (collapse, fold, resize) ── */
  panes.querySelectorAll("[data-pane-fold]").forEach(b=>b.onclick=()=>{
    const id = b.dataset.paneFold;
    if (S.ui.paneCollapsed[id]) delete S.ui.paneCollapsed[id];
    else S.ui.paneCollapsed[id] = true;
    saveLayout(); render(); });
  scBody.querySelectorAll("[data-fold]").forEach(b=>b.onclick=()=>{
    /* read the state off the button rather than recomputing the default -- some
       folds ship closed (an empty provider group) and a hardcoded default here
       would invert their first click */
    S.ui.folds[b.dataset.fold] = b.getAttribute("aria-expanded") === "true" ? 0 : 1;
    saveLayout(); render(); });
  wireDivider();

  /* ── tenant ── */
  scBody.querySelectorAll("[data-pick-tenant]").forEach(b=>
    b.onclick = ()=>pickTenant(b.dataset.pickTenant));
  const og = scBody.querySelector("#openGate");
  if (og) og.onclick = ()=>{ S.gate = true; render(); };

      .then(r=>{ PROVIDERS = r.providers || PROVIDERS;

      S.setOk = null;
      S.setError = m + " auto-approves agent actions and is gated. Restart the server with "

    if (spec.writes_files && !window.confirm(

    apiPost("/api/settings", { permission_mode: m })
      .then(r=>{ SETTINGS = r.settings || SETTINGS;
                 /* Report what will RUN, not what was written — they differ when clamped. */
                 S.setOk = "permission mode is now "
                         + ((SETTINGS||{}).permission_mode_effective || (SETTINGS||{}).permission_mode) + "."; })
      .catch(e=>{ S.setError = e.message; })
      .then(()=>{ S.setBusy = null; render(); }); });

  /* ── git ── */
  scBody.querySelectorAll("[data-gitfile]").forEach(b=>b.onclick=()=>{
    const p = b.dataset.gitfile;
    /* Clicking the selected file again closes the diff rather than re-fetching it. */
    if (S.gitFile === p){ S.gitFile = null; S.gitDiff = null; render(); return; }
    loadGitDiff(p);
  });

  /* ── workdir ── */
  const wdIn = scBody.querySelector("[data-workdir-input]");
  if (wdIn){
    wdIn.oninput = ()=>{ S.workdirDraft = wdIn.value; };   /* no render: it would fight the caret */
    wdIn.onkeydown = e=>{ if (e.key === "Enter"){ e.preventDefault();
      const b = scBody.querySelector("[data-workdir-save]"); if (b) b.click(); } };
  }
  const wdSave = scBody.querySelector("[data-workdir-save]");
  if (wdSave) wdSave.onclick = ()=>{
    const el = scBody.querySelector("[data-workdir-input]");
    const want = (el ? el.value : "").trim();
    if (!want){ S.setError = "a working directory is required"; S.setOk = null; render(); return; }
    S.setBusy = "workdir"; S.setError = null; S.setOk = null; render();
    apiPost("/api/settings", { workdir: want })
      .then(r=>{ SETTINGS = r.settings || SETTINGS;
                 /* Report what the SERVER stored (it expands ~ and resolves symlinks), not what
                    was typed -- they differ, and echoing the input would misreport the result. */
                 S.workdirDraft = null;
                 S.setOk = "sessions will now start in " + ((SETTINGS||{}).workdir || want) + "."; })
      .catch(e=>{ S.setError = e.message; })
      .then(()=>{ S.setBusy = null; render(); }); };

  const ea=scBody.querySelector("[data-expall]");
  if(ea) ea.onclick=()=>{ S.collapsed.clear(); render(); };
  const ca=scBody.querySelector("[data-collall]");
  if(ca) ca.onclick=()=>{ live().forEach(d=>{ if(d.parent_ref) S.collapsed.add(d.ref); }); render(); };

  /* session panes */
  panes.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{
    S.sessTab[b.dataset.sid]=b.dataset.tab; render(); });
  panes.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{
    closeClaudeChannel(b.dataset.close);
    S.openPanes = S.openPanes.filter(id=>id!==b.dataset.close); render(); });
  /* the composer is NOT disabled while a turn runs: the reply streams in, and disabling
     the input mid-stream blurred it and dropped whatever was being typed next */
  panes.querySelectorAll("[data-ssend]").forEach(b=>b.onclick=()=>{
    const inp=panes.querySelector('[data-sask="'+b.dataset.ssend+'"]');
    if(inp && inp.value.trim()){ const t=inp.value.trim(); inp.value=""; S.composerText[b.dataset.ssend]=""; S.palette=null;
      submitTurn(t, b.dataset.ssend); } });
  panes.querySelectorAll("[data-sask]").forEach(inp=>{
    const sid = inp.dataset.sask;
    /* "/" opens the palette; it only ever lists commands that actually
       resolve, because the source is GET /api/skills reading ~/.claude. */
    inp.oninput = ()=>{
      S.composerText[sid] = inp.value;
      const p = paletteFor(inp.value);
      const was = S.palette && S.palette.sid===sid;
      if (p && p.items.length){ S.palette = { sid, items:p.items, idx:0, token:p.token }; render(); }
      else if (was){ S.palette = null; render(); }
    };
    inp.onkeydown = e=>{
      const pal = S.palette && S.palette.sid===sid ? S.palette : null;
      if (pal){
        if (e.key==="ArrowDown"){ e.preventDefault(); pal.idx=(pal.idx+1)%pal.items.length; render(); return; }
        if (e.key==="ArrowUp"){ e.preventDefault(); pal.idx=(pal.idx-1+pal.items.length)%pal.items.length; render(); return; }
        if (e.key==="Enter" || e.key==="Tab"){ e.preventDefault(); applyPalette(sid, pal.idx); return; }
        if (e.key==="Escape"){ e.preventDefault(); S.palette=null; render(); return; }
      }
      if(e.key==="Enter" && inp.value.trim()){ e.preventDefault();
        const t=inp.value.trim(); inp.value=""; S.composerText[sid]=""; S.palette=null;
        submitTurn(t, sid); }
    };
  });
  panes.querySelectorAll("[data-pal]").forEach(r=>r.onclick=()=>{
    if (S.palette) applyPalette(S.palette.sid, +r.dataset.pal); });
  panes.querySelectorAll('.pane:not(.browse) [data-ref]').forEach(n=>n.onclick=()=>{
    S.screen="departments"; S.sel=n.dataset.ref; render(); });

  scBody.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{S.view=b.dataset.view;render();});
  scBody.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{
    S[b.dataset.toggle]=!S[b.dataset.toggle];
    /* showAcme widens the scope SERVER-side (all_tenants=true). Under ?tenant=
       the other tenants' rows were never fetched, so filtering locally would
       render "none" as though that were a finding. Refetch instead. */
    if (b.dataset.toggle === "showAcme"){ render(); refetchOrg(); }
    else render(); });
  scBody.querySelectorAll("[data-ref]").forEach(n=>{
    /* the tile IS the control: selecting a department also opens or closes its subtree */
    n.onclick=()=>{ const r=n.dataset.ref;
      if (DOMAINS.some(k=>k.parent_ref===r))
        S.collapsed.has(r) ? S.collapsed.delete(r) : S.collapsed.add(r);
      S.sel=r; render(); };
    if (n.getAttribute("draggable")==="true"){
      n.ondragstart=e=>{ S.drag=n.dataset.ref; n.classList.add("drg");
        e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain",n.dataset.ref);
        paintRings(n.dataset.ref); };
      n.ondragend=()=>{ S.drag=null; clearRings(); flushRender(); };
    }
    n.ondragover=e=>{ if(!S.drag) return;
      const src=byRef(S.drag), tgt=byRef(n.dataset.ref);
      if (!src||!tgt) return;
      if (blockCodesForMove(src,tgt).length) return;      /* no preventDefault ⇒ drop never fires */
      e.preventDefault(); e.dataTransfer.dropEffect="move"; };
    n.ondrop=e=>{ e.preventDefault(); if(!S.drag){ flushRender(); return; }
      const src=byRef(S.drag), tgt=byRef(n.dataset.ref);
      if (!src||!tgt) return;
      if (src.parent_ref===tgt.ref){ clearRings(); S.drag=null; flushRender(); return; }  /* inert no-op */
      if (blockCodesForMove(src,tgt).length){ clearRings(); S.drag=null; flushRender(); return; }
      S.draft.ops.push({op:"move",ref:src.ref,target:tgt.ref}); saveDraft();
      S.drag=null; render(); };
  });
  const sqEl=scBody.querySelector("#sq");
  if(sqEl) sqEl.oninput=()=>runSearch(sqEl.value);
  scBody.querySelectorAll("[data-goto-domain]").forEach(r=>r.onclick=()=>{
    S.screen="departments"; S.sel=r.dataset.gotoDomain; render(); });
  const q=scBody.querySelector("#q");
  if(q) q.oninput=()=>{S.q=q.value; const p=q.selectionStart; render();
    const n=scBody.querySelector("#q"); if(n){n.focus(); n.setSelectionRange(p,p);} };
  scBody.querySelectorAll("[data-facet]").forEach(b=>b.onclick=()=>{
    const g=S.cf[b.dataset.facet]; const v=b.dataset.val;
    g.has(v)?g.delete(v):g.add(v); render(); });
  scBody.querySelectorAll("[data-sort]").forEach(h=>h.onclick=()=>{
    const c=h.dataset.sort; S.sort = {col:c, dir: S.sort.col===c ? -S.sort.dir : 1}; render(); });
  scBody.querySelectorAll("[data-charter]").forEach(r=>r.onclick=()=>{S.selCharter=r.dataset.charter;render();});
  scBody.querySelectorAll("[data-pmode]").forEach(b=>b.onclick=()=>{S.pmode=b.dataset.pmode;render();});
  scBody.querySelectorAll("[data-revert]").forEach(b=>b.onclick=()=>{
    S.draft.ops.splice(+b.dataset.revert,1); saveDraft(); render(); });
  const rat=scBody.querySelector("#rat");
  /* debounced + chained: one POST per pause, and writes cannot overtake each
     other (an earlier keystroke's request landing last used to roll the stored
     rationale backwards) */
  if(rat) rat.oninput=()=>{S.draft.rationale=rat.value; saveDraftSoon();};
  /* The drift-simulation dev control was removed: it was a developer
   affordance on a product surface, and it was inverted -- it bumped a client-side
   counter the server never compared against, so it did nothing, while Rebase (which
   should CLEAR drift) was what actually triggered ORG-010. Real drift still surfaces:
   the server compares the draft's captured base against the registry on every
   simulate, so a concurrent mint raises ORG-010 without anyone faking it. */
  const rb=scBody.querySelector("#rebase");
  /* Rebase CLEARS drift: re-capture the registry's REAL fingerprint so the
     POSTed base matches the file again and ORG-010 stops firing. It used to
     write the locally-bumped count — i.e. rebasing CREATED the drift, and
     saveDraft() persisted it server-side across reloads. */
  if(rb) rb.onclick=()=>{ S.draft.base={...S.draft.base, domain_index_lines:META.domain_index_lines,
    captured_ms:Date.now()}; S.drift=false; invalidateSim(); saveDraft(); render(); };
  const dc=scBody.querySelector("#discard");
  if(dc) dc.onclick=()=>{ S.draft={ops:[],base:{...PLANS[0].base},rationale:"",
    plan_origin:"studio-drag",validated_at_ms:null}; S.drift=false;
    invalidateSim(); saveDraft(); render(); };
  const cc=scBody.querySelector("#copyCmd");
  if(cc) cc.onclick=()=>{ const s="placement_engine.py org plan --import ~/.sutra-ui/drafts/"+PLANS[0].plan_id+".json";
    try{ navigator.clipboard.writeText(s); cc.textContent="copied"; setTimeout(()=>cc.textContent="copy",1200);}catch(e){} };
}
function paintRings(srcRef){
  const src = byRef(srcRef); if(!src) return;
  const scBody = document.getElementById("scBody");
  let n=0;
  scBody.querySelectorAll("[data-ref]").forEach(node=>{
    const t = byRef(node.dataset.ref); if(!t) return;
    const codes = blockCodesForMove(src,t);
    if (codes.length){ node.classList.add("ring"); n++;
      node.title = codes.map(c=>c.code+" · "+c.subject).join("\n"); }
    else if (t.ref!==src.ref) node.classList.add("ok-t");
  });
  const s=document.getElementById("dragStatus");
  if(s) s.innerHTML = ` <b style="color:var(--block)">${n} blocked</b> for “${esc(src.name)}”.`;
}
function clearRings(){
  const scBody = document.getElementById("scBody");
  scBody.querySelectorAll("[data-ref]").forEach(n=>{
    n.classList.remove("ring","drg","ok-t"); n.removeAttribute("title"); });
  const s=document.getElementById("dragStatus"); if(s) s.textContent="";
}
document.querySelector(".rail").addEventListener("click", e=>{
  /* The gate short-circuits render(), but the RAIL keeps rendering behind it,
     so its buttons stay live. Navigating without clearing S.gate therefore set
     the new screen and then drew the tenant chooser over it again -- the panel
     looked stuck on "Choose a tenant" no matter what you clicked, with only the
     one "go back" button able to escape. Any deliberate navigation is also an
     answer to the chooser: dismiss it. S.tenant is already set in this state
     (the gate was opened via `switch`, not by the no-tenant path), and when it
     is NOT set render() re-opens the gate on its own, so this cannot strand the
     panel tenant-less. */
  const b = e.target.closest("[data-screen]");
  if (b && !b.disabled){
    /* "terminal" is a PANE TOGGLE living in the nav, not a screen. Routing it
       through S.screen would set S.screen to an id SCREENS has no entry for,
       and render() would blank the browse pane. */
    if (b.dataset.screen === "terminal"){ termToggle(); renderRail(); return; }
    S.gate=false; S.screen=b.dataset.screen;
    if (S.screen === "git") loadGit(false);   /* lazy: only when actually opened */
    render(); return;
  }
  const sg = e.target.closest("[data-sgroup]");
  if (sg){ S.sgroup = sg.dataset.sgroup; render(); return; }
  const op = e.target.closest("[data-open]");
  if (op){ const id=op.dataset.open; S.gate=false;
    if (!S.openPanes.includes(id)) S.openPanes.push(id);
    if (S.openPanes.length>2) S.openPanes = S.openPanes.slice(-2);
    /* opening a REAL session is what triggers the transcript read -- the list
       endpoint only read each file's head, so until now the turns are unknown,
       not empty */
    ensureTranscript(S.sessions.find(s=>s.id===id));
    render(); return; }
  const g = e.target.closest("[data-goto]");
  if (g){ S.screen="departments"; S.sel=g.dataset.goto; render(); }
});
/* New session: opens an empty pane on the right, exactly like the reference */
document.getElementById("newSession").onclick = () => {
  const s = { id:"s-"+(++SID), title:"New session", created_ms:NOW, updated_ms:NOW,
              turns:[], local:true, loadState:"live" };
  S.sessions.unshift(s);
  S.openPanes.push(s.id);
  if (S.openPanes.length>2) S.openPanes = S.openPanes.slice(-2);
  render();
  const inp = document.querySelector('[data-sask="'+s.id+'"]'); if (inp) inp.focus();
};
/* theme */
(function(){
  const r=document.documentElement, KEY="sutra.panel.theme";
  const rd=()=>{try{return localStorage.getItem(KEY)}catch(e){return null}};
  const wr=v=>{try{localStorage.setItem(KEY,v)}catch(e){}};
  const saved=rd(); if(saved==="light"||saved==="dark") r.setAttribute("data-theme",saved);
  const eff=()=>r.getAttribute("data-theme")||
    (matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");
  const lab=()=>themeBtn.setAttribute("aria-label","Switch to "+(eff()==="light"?"dark":"light")+" theme");
  lab();
  themeBtn.onclick=()=>{ const n=eff()==="light"?"dark":"light";
    r.setAttribute("data-theme",n); wr(n); lab(); };
})();
/* ══════════════════════ bootstrap ══════════════════════
   Order matters and is the whole point of "tenant-first": /api/tenants is read
   BEFORE any registry endpoint, because every one of them is scoped by the
   answer. Nothing about departments, charters or placements is fetched — let
   alone drawn — until the scope is settled. */

function backendError(e){
  document.getElementById("panes").innerHTML =
    `<section class="pane browse"><div class="pb">
      <div class="zero"><h4>Could not reach the backend</h4>
      <p>${esc(e.message)}</p>
      <p style="color:var(--faint)">Is the server running? <code>uvicorn app:app</code> from
      <code>sutra-ui/</code>.</p></div></div></section>`;
  console.error(e);
}

/* Registry reads, all carrying the current scope. Separated from the runtime
   reads below because switching tenants must redo these and need not redo those. */
async function loadOrg(){
  const q = scopeQ();
  const [tree, charters, placements, history] = await Promise.all([
    apiGet("/api/org/tree?include_retired=true&" + q),
    apiGet("/api/org/charters?" + q),
    apiGet("/api/org/placements?" + q),
    apiGet("/api/org/history?" + tenantQ()),
  ]);
  DOMAINS = tree;
  CHARTERS = charters;
  PLACEMENTS = placements;
  INDEX = history.events || [];
  // history_complete_from_ms is DERIVED server-side (earliest event carrying a
  // before/after snapshot), not a stored engine field -- see /api/org/history.
  META.history_complete_from_ms = history.meta.history_complete_from_ms;
  META.history_derived = history.meta.derived;
  META.domain_index_lines = history.meta.domain_index_lines;
  META.legacy_events = history.meta.legacy_events;
  invalidateSim();
}

/* Machine state, not registry state: what can run, and how it is configured.
   Tenant-independent, so a tenant switch does not refetch it. */
async function loadRuntime(){
  const [skills, provs, settings] = await Promise.all([
    apiGet("/api/skills"),
    apiGet("/api/providers"),
    apiGet("/api/settings"),
  ]);
  SKILLS = skills.items || [];
  SKILLS_META = { by_kind: skills.by_kind, by_source: skills.by_source,
                  by_provider: skills.by_provider, total: skills.total,
                  runnable: skills.runnable, providers: skills.providers || [] };
  PROVIDERS = provs.providers || [];
  SETTINGS = settings.settings || null;
  PERM_MODES = settings.permission_modes || [];
}

/* Git is fetched on demand, not at boot: a workdir that is not a repository is a
   perfectly normal state and must not cost a failed request on every start. */
async function loadGit(force){
  if (S.git && !force) return;
  try {
    const [status, log] = await Promise.all([apiGet("/api/git/status"), apiGet("/api/git/log")]);
    S.git = { repo: status.repo, status, commits: log.commits || [] };
    S.gitError = null;
  } catch (e) {
    /* The server's message names the actual cause (not a repo / outside the root /
       git not installed). Surfacing our own wording would lose that. */
    S.gitError = e.message; S.git = null;
  }
  render();
}

async function loadGitDiff(path){
  S.gitFile = path; S.gitDiff = null; S.gitDiffTruncated = false; render();
  try {
    const d = await apiGet("/api/git/diff?path=" + encodeURIComponent(path));
    if (S.gitFile !== path) return;          /* a newer selection won; drop this one */
    S.gitDiff = d.text || ""; S.gitDiffTruncated = !!d.truncated;
  } catch (e) {
    if (S.gitFile !== path) return;
    S.gitDiff = ""; S.gitError = e.message;
  }
  render();
}

/* The REAL sessions. session_reader.list_sessions() walks
   ~/.claude/projects/<encoded-cwd>/*.jsonl, newest first. Nothing here is
   derived from placements. */
async function loadSessions(){
  adoptRealSessions(await apiGet("/api/sessions?limit=100"));
}

function refetchOrg(){
  loadOrg().then(render).catch(backendError);
}

function pickTenant(id){
  if (!id) return;
  const changed = id !== S.tenant;
  S.tenant = id;
  META.tenant_id = id;
  S.gate = false;
  lsSet(LS_TENANT, id);
  if (!changed && S.loaded){ render(); return; }
  /* A different tenant is a different scope. Selections, search results and the
     memoized simulate() answers all belong to the old one; carrying them across
     would attribute one tenant's findings to another. */
  S.sel = null; S.selCharter = null;
  S.searchRes = null; S.searchHits = null; S.sq = "";
  S.showAcme = false;
  S.loaded = false;
  invalidateSim();
  render();
  loadOrg().then(()=>{ S.loaded = true; render(); }).catch(backendError);
}

async function boot(){
  const panes = document.getElementById("panes");
  panes.innerHTML = `<section class="pane browse"><div class="pb" style="display:flex;
    align-items:center;justify-content:center;color:var(--faint);font-size:13px">
    Reading tenants…</div></section>`;
  try {
    TENANTS = await apiGet("/api/tenants");
  } catch (e) {
    S.tenantsError = e.message;
    TENANTS = [];
    backendError(e);
    return;
  }

  const stored = lsGet(LS_TENANT, null);
  if (TENANTS.length === 1){
    /* ONE TENANT: auto-select. See tenantGateHtml() -- a chooser with a single
       option is a click that carries no information, and this registry has
       exactly one tenant today. The chooser stays reachable from the rail
       footer, so the behaviour is switchable rather than hidden. */
    S.tenant = TENANTS[0].tenant_id;
  } else if (stored && TENANTS.some(r=>r.tenant_id === stored)){
    S.tenant = stored;
  } else {
    S.tenant = null;      /* two or more, nothing remembered -> the gate blocks */
  }
  if (S.tenant){ META.tenant_id = S.tenant; lsSet(LS_TENANT, S.tenant); }
  if (!S.tenant){ render(); return; }

  panes.innerHTML = `<section class="pane browse"><div class="pb" style="display:flex;
    align-items:center;justify-content:center;color:var(--faint);font-size:13px">
    Loading ${esc(S.tenant)}…</div></section>`;
  try {
    /* allSettled, NOT all: these are three independent subsystems, and
       Promise.all rejects the whole boot on the first failure — so a registry
       hiccup discarded a perfectly good /api/skills and /api/settings response
       and the panel came up blank. Only the registry is load-bearing; runtime
       and sessions degrade to a stated error on their own screens. */
    const [org, runtime, sessions] =
      await Promise.allSettled([loadOrg(), loadRuntime(), loadSessions()]);
    if (org.status === "rejected") throw org.reason;   /* the one hard dependency */
    S.runtimeError  = runtime.status  === "rejected" ? String(runtime.reason  && runtime.reason.message  || runtime.reason)  : null;
    S.sessionsError = sessions.status === "rejected" ? String(sessions.reason && sessions.reason.message || sessions.reason) : null;
    await loadDraft();
    /* A base persisted from an earlier session can ALREADY be stale — the
       registry moved while nobody was looking. That is real drift: ORG-010
       fires for it server-side, so the banner has to explain the finding and
       Rebase (the only cure, and the control that is disabled unless S.drift)
       has to be reachable. Derived from the two counts, never stored. */
    S.drift = !!(S.draft.base && S.draft.base.domain_index_lines !== undefined &&
                 S.draft.base.domain_index_lines !== META.domain_index_lines);

    /* Open on two levels — root + its children. Deeper tiers collapse so the chart fits
       the pane; clicking a collapsed tile is the only control (feedback #4). */
    live().forEach(d=>{ if (d.parent_ref && DOMAINS.some(k=>k.parent_ref===d.ref)) S.collapsed.add(d.ref); });
    /* Open the most recent REAL session so the pane model is visible on load, and
       read its transcript — the pane shows what is in the file, or says plainly
       that there was nothing to read. */
    if (!S.openPanes.length && S.sessions.length){
      S.openPanes.push(S.sessions[0].id);
      ensureTranscript(S.sessions[0]);
    }

    S.loaded = true;
    render();
    /* AFTER render + SETTINGS: termMount() reads SETTINGS.workdir for the PTY cwd,
       so restoring the pane earlier would start the terminal in the wrong directory. */
    S.termW = clampTermW(Number(lsGet(LS_TERMW, TERM_DEFAULT)) || TERM_DEFAULT);
    if (lsGet(LS_TERM, false) === true) termToggle(true);
  } catch (e) {
    backendError(e);
  }
}

/* ── terminal ────────────────────────────────────────────────────────────────
   Mount-once, show/hide thereafter. The iframe carries a live WebSocket to a PTY
   running `claude`; re-creating it on a render would kill that session, so the
   only operations here are "create if absent" and "toggle hidden". */
const termPaneEl  = document.getElementById("termPane");
const termBodyEl  = document.getElementById("termBody");
const termBtnEl   = document.getElementById("termBtn");
const termCwdEl   = document.getElementById("termCwd");

const TERM_MIN = 280, TERM_MAX_FRAC = 0.72, TERM_DEFAULT = 460;

function clampTermW(px){
  /* innerWidth can be 0 while the window is still being laid out (and is 0 in a
     headless harness). Clamping against it then collapses every width to TERM_MIN
     and, because clamping never grows a value back, the pane stays stuck narrow for
     the rest of the session. With no trustworthy viewport, apply the floor only. */
  const vw = (typeof innerWidth === "number" && innerWidth > TERM_MIN) ? innerWidth : 0;
  const want = Math.max(TERM_MIN, Math.round(px));
  return vw ? Math.min(Math.round(vw * TERM_MAX_FRAC), want) : want;
}
/* The GRID TRACK is the single source of truth for the pane width. An `auto` track
   measured the iframe's intrinsic width as 0 and collapsed the pane; an explicit
   pixel value is both deterministic and what the drag handle writes. */
function applyTermW(px){
  S.termW = clampTermW(px);
  document.getElementById("app").style
    .setProperty("--termw", S.termOpen ? S.termW + "px" : "0px");
}

function termMount(force){
  const cwd = (SETTINGS && SETTINGS.workdir) || "";
  const have = termBodyEl.querySelector("iframe");
  if (have && !force) return;
  if (have) have.remove();
  const fr = document.createElement("iframe");
  /* /legacy/term is the EXISTING terminal: it forwards ?cwd= to /ws/term, which
     spawns the real TUI. Reusing that page beats a second terminal-emulator
     integration that would drift from the first.

     The word for that emulator is deliberately not written here: test_05b greps the
     studio HTML for it to prove "/" is not serving the legacy console. The terminal
     is an opt-in pane behind an iframe, so the guard still holds and stays strict. */
  /* shell=1 -> the operator's OWN login shell (zsh on macOS), not the claude TUI:
     this is a terminal, so it has to be able to run git, ls and a build.
     embed=1 -> drops that page's own sidebar and header, which this pane already
     draws, and whose 240px sidebar left the terminal about 120px at pane width. */
  fr.src = "/legacy/term?embed=1&shell=1" + (cwd ? "&cwd=" + encodeURIComponent(cwd) : "");
  fr.title = "Terminal";
  termBodyEl.appendChild(fr);
  S.termCwd = cwd;
  termCwdEl.textContent = cwd;
}

function termToggle(on){
  S.termOpen = on === undefined ? !S.termOpen : !!on;
  termPaneEl.hidden = !S.termOpen;
  applyTermW(S.termW || TERM_DEFAULT);   /* collapses the track to 0px when closed */
  termBtnEl.setAttribute("aria-pressed", String(S.termOpen));
  termBtnEl.setAttribute("aria-label", S.termOpen ? "Hide the terminal" : "Show the terminal");
  if (S.termOpen) termMount(false);
  /* The workdir can have changed since the PTY started. Say so rather than letting
     the header imply the terminal followed the setting. */
  if (S.termOpen && SETTINGS && S.termCwd && SETTINGS.workdir !== S.termCwd){
    termCwdEl.textContent = S.termCwd + "  (workdir changed — restart to move)";
  }
  lsSet(LS_TERM, S.termOpen);   /* lsSet JSON-encodes; store the boolean, not "1" */
}

termBtnEl.onclick = ()=>termToggle();
document.getElementById("termClose").onclick = ()=>termToggle(false);
document.getElementById("termReload").onclick = ()=>termMount(true);

/* ── resize ──────────────────────────────────────────────────────────────────
   Pointer events (not mouse) so a trackpad drag and a touch drag both work, with
   setPointerCapture so the gesture survives the cursor crossing the iframe. The
   iframe gets pointer-events:none for the duration via body.termdrag -- without it
   the cross-document boundary swallows the move events and the drag dies halfway. */
const termGripEl = document.getElementById("termGrip");
termGripEl.addEventListener("pointerdown", e=>{
  e.preventDefault();
  const startX = e.clientX, startW = S.termW || TERM_DEFAULT;
  document.body.classList.add("termdrag");
  try { termGripEl.setPointerCapture(e.pointerId); } catch (_) {}
  const move = ev => applyTermW(startW + (startX - ev.clientX));   /* drag left = wider */
  const up = ()=>{
    document.body.classList.remove("termdrag");
    termGripEl.removeEventListener("pointermove", move);
    termGripEl.removeEventListener("pointerup", up);
    termGripEl.removeEventListener("pointercancel", up);
    lsSet(LS_TERMW, S.termW);
  };
  termGripEl.addEventListener("pointermove", move);
  termGripEl.addEventListener("pointerup", up);
  termGripEl.addEventListener("pointercancel", up);
});
/* Keyboard parity with the browse divider: the pane must be resizable without a pointer. */
termGripEl.addEventListener("keydown", e=>{
  const step = e.shiftKey ? 64 : 16;
  if (e.key === "ArrowLeft"){ e.preventDefault(); applyTermW((S.termW||TERM_DEFAULT) + step); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); applyTermW((S.termW||TERM_DEFAULT) - step); }
  else if (e.key === "Home"){ e.preventDefault(); applyTermW(TERM_DEFAULT); }
  else return;
  lsSet(LS_TERMW, S.termW);
});
/* A width stored on a wide display must not exceed a narrower window later.
   GUARDED: test_panel.js evaluates this script in a bare Node vm context that has a
   stubbed `document` but no window globals, so an unguarded top-level
   addEventListener throws ReferenceError and takes all 32 assertions down with it. */
if (typeof addEventListener !== "undefined"){
  addEventListener("resize", ()=>{ if (S.termOpen) applyTermW(S.termW || TERM_DEFAULT); });
}

/* One click hides the whole sidebar and the panes take the freed column.
   The toggle lives in the masthead so it stays reachable when the rail is gone. */
const railToggle = document.getElementById("railToggle");
const railShow = document.getElementById("railShow");
if (railShow) railShow.onclick = ()=>{ railToggle.onclick(); };
railToggle.onclick = ()=>{
  S.ui.railCollapsed = !S.ui.railCollapsed;
  railToggle.setAttribute("aria-pressed", String(!!S.ui.railCollapsed));
  railToggle.setAttribute("aria-label", S.ui.railCollapsed ? "Show the sidebar" : "Hide the sidebar");
  railToggle.title = railToggle.getAttribute("aria-label");
  saveLayout();
  render();
};

/* Rail sections collapse on a click anywhere on their header. */
document.querySelector(".rail").addEventListener("click", e=>{
  const tabBtn = e.target.closest("[data-railtab]");
  if (tabBtn){
    S.ui.railTab = tabBtn.dataset.railtab;
    saveLayout();
    renderRail();
    return;
  }
  const sec = e.target.closest("[data-railsec]");
  if (!sec) return;
  const key = sec.dataset.railsec;
  S.ui.railSections[key] = !(S.ui.railSections[key] !== false);
  saveLayout();
  renderRail();
}, true);

const tenantMenuEl = document.getElementById("tenantMenu");
const tenantSwitchEl = document.getElementById("tenantSwitch");
function closeTenantMenu(){
  tenantMenuEl.hidden = true;
  tenantSwitchEl.setAttribute("aria-expanded","false");
}
tenantSwitchEl.onclick = (e)=>{
  e.stopPropagation();
  const open = tenantMenuEl.hidden;
  renderTenantMenu();
  tenantMenuEl.hidden = !open;
  tenantSwitchEl.setAttribute("aria-expanded", String(open));
};
tenantMenuEl.addEventListener("click", e=>{
  const b = e.target.closest("[data-pick-tenant]");
  if (!b) return;
  closeTenantMenu();
  pickTenant(b.dataset.pickTenant);
});
document.addEventListener("click", e=>{
  if (tenantMenuEl.hidden) return;
  if (!e.target.closest(".tmenuwrap")) closeTenantMenu();
});
document.addEventListener("keydown", e=>{ if (e.key === "Escape") closeTenantMenu(); });
boot();
</script>
